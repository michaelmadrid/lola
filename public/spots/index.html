<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Spots — POSTO</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/spots.css">
  <link rel="stylesheet" href="/css/themes/pills.css">
  <link rel="stylesheet" href="/css/themes/pills2.css">
  <link rel="stylesheet" href="/css/home.css"><!-- reused for save editor + stream styles -->
  <link rel="stylesheet" href="/css/capture-overlay.css">
  <link rel="stylesheet" href="/css/uploader.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">POSTO</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
    <div class="menu-overlay__inner"></div>
  </div>

<main class="page page-spots">

  <header class="mast">
    <div class="mast__head">
      <div>
        <h1 class="mast__title">Spots</h1>
        <p class="mast__count" id="spot-count"></p>
      </div>
      <div class="mast__head-right">
        <button class="btn" id="capture-launcher" type="button">+ Add a spot</button>
      </div>
    </div>
  </header>

  <div class="bulk-bar" id="bulk-bar" hidden>
    <span class="bulk-bar__count" id="bulk-count">0 selected</span>
    <div class="bulk-bar__actions">
      <button class="btn btn--small" id="bulk-curate">Make curated</button>
      <button class="btn btn--small btn--secondary" id="bulk-standard">Make standard</button>
      <button class="btn btn--small btn--ghost btn--danger" id="bulk-trash">Move to trash</button>
      <button class="btn btn--small btn--ghost" id="bulk-restore" hidden>Restore</button>
      <button class="btn btn--small btn--ghost btn--danger" id="bulk-delete-forever" hidden>Delete forever</button>
      <button class="bulk-bar__cancel" id="bulk-clear">Clear</button>
    </div>
  </div>

  <!-- Capture overlay v2 — identical markup to home. Loaded by /js/capture-overlay.js -->
  <div class="capture-fs capture-fs--v2" id="capture-fs" hidden aria-hidden="true">
    <div class="capture-fs__inner">

      <header class="capture-fs__head">
        <button class="capture-fs__close" id="capture-fs-close" aria-label="Close" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="capture-fs__more" id="capture-fs-more" aria-label="More options (coming soon)" type="button" disabled>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="4" cy="10" r="1.2" fill="currentColor"/>
            <circle cx="10" cy="10" r="1.2" fill="currentColor"/>
            <circle cx="16" cy="10" r="1.2" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <div class="capture-fs__bind">
        <button class="capture-fs__city-btn" id="capture-fs-city-btn" type="button">
          <span id="capture-fs-city-btn-name">Bali</span>
          <span class="capture-fs__city-caret" aria-hidden="true">▾</span>
        </button>
        <div class="capture-fs__city-popover" id="capture-fs-city-popover">
          <input type="text" class="capture-fs__city-search" id="capture-fs-city-search" placeholder="Type a city…" autocomplete="off">
          <div class="capture-fs__city-list" id="capture-fs-city-list"></div>
        </div>

        <button class="capture-fs__been-btn" id="capture-fs-been-btn" data-been="true" type="button" aria-label="Toggle been or want to go">
          <span id="capture-fs-been-text">Been</span>
        </button>

        <button class="capture-fs__cat-btn" id="capture-fs-cat-btn" type="button">
          <span id="capture-fs-cat-btn-name">Category</span>
        </button>
        <div class="capture-fs__cat-popover" id="capture-fs-cat-popover">
          <div class="capture-fs__cat-list" id="capture-fs-cat-list"></div>
        </div>
      </div>

      <div class="capture-fs__body">
        <textarea
          class="capture-fs__place"
          id="capture-fs-place"
          placeholder="What's the place?"
          autocomplete="off"
          spellcheck="false"
          rows="1"
        ></textarea>
        <textarea
          class="capture-fs__tip"
          id="capture-fs-tip"
          placeholder="Leave a tip…"
          autocomplete="off"
          spellcheck="false"
          rows="1"
          hidden
          tabindex="-1"
        ></textarea>
      </div>

      <footer class="capture-fs__foot">
        <button class="capture-fs__submit" id="capture-fs-submit" type="button" disabled>
          Save spot <span class="kbd">⌘↵</span>
        </button>
      </footer>
    </div>
  </div>

  <div class="search-wrap">
    <input
      type="text"
      class="search-input"
      id="search-input"
      placeholder="Search by name…"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    >
  </div>

  <!-- Filter row: city + type + been-state. All default to "All".
       Each picker is wrapped in .picker-group so its popover anchors to
       its own trigger button, not the entire row. -->
  <div class="spots-filters">
    <div class="picker-group">
      <button class="picker-btn" id="city-picker-btn" type="button" aria-haspopup="true">
        <span class="picker-btn__label" id="city-picker-label">All cities</span>
        <span class="picker-btn__caret" aria-hidden="true">▾</span>
      </button>
      <div class="picker-popover" id="city-picker-popover" hidden>
        <input type="text" class="picker-search" id="city-picker-search" placeholder="Search cities…" autocomplete="off">
        <div class="picker-list" id="city-picker-list"></div>
      </div>
    </div>

    <div class="picker-group">
      <button class="picker-btn" id="type-picker-btn" type="button" aria-haspopup="true">
        <span class="picker-btn__label" id="type-picker-label">All types</span>
        <span class="picker-btn__caret" aria-hidden="true">▾</span>
      </button>
      <div class="picker-popover" id="type-picker-popover" hidden>
        <div class="picker-list" id="type-picker-list"></div>
      </div>
    </div>

    <div class="picker-group">
      <button class="picker-btn" id="been-picker-btn" type="button" aria-haspopup="true">
        <span class="picker-btn__label" id="been-picker-label">All</span>
        <span class="picker-btn__caret" aria-hidden="true">▾</span>
      </button>
      <div class="picker-popover" id="been-picker-popover" hidden>
        <div class="picker-list" id="been-picker-list"></div>
      </div>
    </div>

    <!-- Curated/Standard/Trash — a filter pill like the others, pushed right -->
    <div class="picker-group picker-group--view">
      <button class="picker-btn" id="view-picker-btn" type="button" aria-haspopup="true">
        <span class="picker-btn__label" id="view-picker-label">All</span>
        <span class="picker-btn__caret" aria-hidden="true">▾</span>
      </button>
      <div class="picker-popover" id="view-picker-popover" hidden>
        <div class="picker-list" id="view-picker-list"></div>
      </div>
    </div>
  </div>

  <!-- The list -->
  <div class="stream spots-grid" id="spots-list">
    <div class="stream__empty">Loading…</div>
  </div>

</main>

<!-- Save editor modal (same markup as home) -->
<div class="modal spot-fs" id="spot-editor">
  <div class="modal__head spot-fs__head">
    <button class="btn-close-circle" id="spot-editor-close" aria-label="Close" type="button">×</button>
    <h3 class="spot-fs__title">Edit</h3>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner spot-fs__inner">
      <!-- Place name -->
      <div class="spot-fs__field">
        <label class="spot-fs__label" for="spot-fs-place">Place</label>
        <input type="text" class="spot-fs__input" id="spot-fs-place" placeholder="Place name">
      </div>

      <!-- Tip -->
      <div class="spot-fs__field">
        <label class="spot-fs__label" for="spot-fs-tip">Tip</label>
        <input type="text" class="spot-fs__input" id="spot-fs-tip" placeholder="Note, advice…">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="spot-fs-city">City</label>
        <select class="spot-fs__select" id="spot-fs-city"><option value="">— none —</option></select>
      </div>
      <!-- Category -->
      <div class="spot-fs__field">
        <label class="spot-fs__label" for="spot-fs-category">Category</label>
        <select class="spot-fs__select" id="spot-fs-category">
          <option value="">— none —</option>
          <option value="bookstore">Bookstore</option>
          <option value="film_lab">Film Lab</option>
          <option value="record_store">Record Store</option>
          <option value="cinema">Cinema</option>
          <option value="gallery">Gallery</option>
          <option value="coffee">Coffee</option>
          <option value="eat">Eat</option>
          <option value="drink">Drink</option>
          <option value="hotel">Hotel</option>
          <option value="shop">Shop</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Been / Want to go -->
      <div class="spot-fs__field">
        <label class="spot-fs__label">Status</label>
        <div class="spot-fs__been-row">
          <button type="button" class="spot-fs__been-pill" id="spot-fs-been-yes" data-active="true">I've been here</button>
          <button type="button" class="spot-fs__been-pill" id="spot-fs-been-no" data-active="false">I want to go</button>
        </div>
      </div>

      <!-- Tags -->
      <div class="spot-fs__field">
        <label class="spot-fs__label">Tags</label>
        <div class="tag-input" id="spot-fs-tag-input">
          <div class="tag-input__pills" id="tag-pills"></div>
          <input type="text" class="tag-input__field" id="tag-field" placeholder="Add tag, press enter or comma…">
        </div>
      </div>

      <div class="spot-fs__divider"></div>

      <!-- Website -->
      <div class="spot-fs__field">
        <label class="spot-fs__label" for="spot-fs-website">Website</label>
        <input type="url" class="spot-fs__input" id="spot-fs-website" placeholder="https://…">
      </div>

      <!-- Instagram -->
      <div class="spot-fs__field">
        <label class="spot-fs__label" for="spot-fs-instagram">Instagram</label>
        <input type="text" class="spot-fs__input" id="spot-fs-instagram" placeholder="@handle or URL">
      </div>

      <!-- Online only -->
      <div class="spot-fs__field">
        <label class="spot-fs__label">Location</label>
        <div class="spot-fs__been-row">
          <button type="button" class="spot-fs__been-pill" id="spot-fs-online-no" data-active="true">Physical place</button>
          <button type="button" class="spot-fs__been-pill" id="spot-fs-online-yes" data-active="false">Online only</button>
        </div>
      </div>

      <!-- Image -->
      <div class="spot-fs__field">
        <label class="spot-fs__label">Image</label>
        <div class="uploader" id="spot-fs-uploader">
          <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
          <div class="uploader__preview"></div>
          <button type="button" class="uploader__btn">Upload image</button>
          <button type="button" class="uploader__btn uploader__btn--remove" id="spot-fs-image-remove" hidden>Remove image</button>
        </div>
      </div>

      <!-- Google Maps link -->
      <div class="spot-fs__field" id="spot-fs-map-field">
        <label class="spot-fs__label">Map</label>
        <div class="maps-link" id="spot-fs-maps-link">
          <a class="maps-link__pill" id="maps-link-pill" href="#" target="_blank" rel="noopener" hidden>
            <span id="maps-link-text">Map ↗</span>
          </a>
          <button type="button" class="maps-link__empty" id="maps-link-empty">No map linked</button>
          <button type="button" class="maps-link__edit" id="maps-link-edit-btn" aria-label="Change map link">✎</button>
          <div class="maps-link__editor" id="maps-link-editor" hidden>
            <input type="text" class="spot-fs__input" id="maps-link-input" placeholder="Paste a Google Maps link…">
            <div class="maps-link__editor-actions">
              <button type="button" class="btn btn--small" id="maps-link-submit">Resolve</button>
              <button type="button" class="btn btn--small btn--ghost" id="maps-link-cancel">Cancel</button>
              <button type="button" class="btn btn--small btn--ghost btn--danger" id="maps-link-remove">Remove link</button>
            </div>
            <p class="spot-fs__hint" id="maps-link-status"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal__foot spot-fs__foot">
    <button class="spot-fs__danger" id="spot-fs-delete">Delete</button>
    <button class="btn" id="spot-fs-save">Save<span class="kbd">⌘ ↵</span></button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/capture-overlay.js"></script>
<script src="/js/uploader.js"></script>
<script src="/js/spot-editor.js"></script>
<script src="/js/spots.js"></script>
<script src="/js/nav.js"></script>
</body>
</html>
