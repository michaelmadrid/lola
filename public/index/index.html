<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Index — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav">
    <a href="/" data-auth="in">Home</a>
    <a href="/trips.html" data-auth="in">Trips</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/index/" class="is-active">Index</a>
    <a href="/atlas/">Atlas</a>
    <a href="/login.html" data-auth="out">Sign in</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/" data-auth="in">Home</a>
    <a href="/trips.html" data-auth="in">Trips</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/index/" class="is-active">Index</a>
    <a href="/atlas/">Atlas</a>
    <a href="/settings.html" data-auth="in">Settings</a>
      <a href="/admin/" data-auth="in">Admin</a>
    <a href="/login.html" data-auth="out">Sign in</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<main class="page page-index">

  <header class="mast">
    <h1 class="mast__title">Index</h1>
    <p class="mast__intro">A directory of sorts</p>
  </header>

  <div class="search-wrap">
    <input
      type="text"
      class="search-input"
      id="search-input"
      placeholder="Search by name…"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    >
  </div>

  <div class="filters">
    <div class="filter-group" id="cat-filters">
      <span class="filter-group__label">Type:</span>
      <button class="filter-chip is-active" data-cat="all">All</button>
      <button class="filter-chip" data-cat="bookshop">Bookshop</button>
      <button class="filter-chip" data-cat="coffee">Coffee</button>
      <button class="filter-chip" data-cat="film-lab">Film&nbsp;lab</button>
      <button class="filter-chip" data-cat="gallery">Gallery</button>
      <button class="filter-chip" data-cat="hotel">Hotel</button>
    </div>
    <div class="filter-group filter-group--type-mobile">
      <select class="filter-select" id="cat-select-mobile">
        <option value="all">All types</option>
        <option value="bookshop">Bookshop</option>
        <option value="coffee">Coffee</option>
        <option value="film-lab">Film lab</option>
        <option value="gallery">Gallery</option>
        <option value="hotel">Hotel</option>
      </select>
    </div>
    <div class="filter-group">
      <select class="filter-select" id="city-select">
        <option value="all">All cities</option>
      </select>
      <span class="filter-divider"></span>
      <select class="filter-select" id="sort-select">
        <option value="name">Sort: A–Z</option>
        <option value="city">Sort: city</option>
        <option value="country">Sort: country</option>
      </select>
    </div>
  </div>

  <div class="list" id="list">
    <div class="list-empty" id="list-empty">Loading…</div>
  </div>

  <div class="list-summary">
    <a href="/admin/places.html" class="list-summary__edit" data-auth="in">edit ↗</a>
  </div>

</main>

<footer class="foot">
  <div class="foot__bar">
    <div class="foot__left">
      <a class="ver" href="/idle/" title="snake">kit v0.5.1</a>
    </div>
    <div class="foot__right">
      <a href="/settings.html" data-auth="in">Settings</a>
      <a href="/admin/" data-auth="in">Admin</a>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
