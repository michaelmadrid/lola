<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Capture — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/home.css"><!-- launcher + overlay styles -->
  <style>
    /* Standalone /capture/ page: chrome-less, just the overlay full-bleed.
       The overlay markup is below; this CSS makes it visible immediately
       on page load without needing a launcher. */
    body { background: var(--bg); }
    .capture-page-host {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<main class="capture-page-host">
  <!-- Capture overlay — same markup as home + spots.
       On this page it auto-opens via CaptureOverlay.init({ autoOpen: true }). -->
  <div class="capture-fs is-open" id="capture-fs" aria-hidden="false">
    <div class="capture-fs__inner">
      <header class="capture-fs__head">
        <a href="/" class="btn-close-circle" id="capture-fs-close" aria-label="Close">×</a>
      </header>

      <div class="capture-fs__bind">
        <div class="capture-fs__bind-row">
          <span class="capture-fs__bind-label">In</span>
          <button class="capture-fs__city-btn" id="capture-fs-city-btn" type="button">
            <span id="capture-fs-city-btn-name">Bali</span>
            <span class="capture-fs__city-caret" aria-hidden="true">▾</span>
          </button>
        </div>
        <div class="capture-fs__city-popover" id="capture-fs-city-popover">
          <input type="text" class="capture-fs__city-search" id="capture-fs-city-search" placeholder="Type a city…" autocomplete="off">
          <div class="capture-fs__city-list" id="capture-fs-city-list"></div>
        </div>

        <button class="capture-fs__been-btn" id="capture-fs-been-btn" data-been="true" type="button" aria-label="Toggle been or want to go">
          <span id="capture-fs-been-text">I've been here</span>
        </button>
      </div>

      <div class="capture-fs__body">
        <textarea
          class="capture-fs__textarea"
          id="capture-fs-textarea"
          placeholder="Tampopo - try the ramen"
          autocomplete="off"
          spellcheck="false"
          rows="1"
        ></textarea>
      </div>

      <footer class="capture-fs__foot">
        <button class="btn btn--secondary" id="capture-fs-submit-continue" type="button">
          Save & continue <span class="kbd">⌘↵</span>
        </button>
        <button class="btn" id="capture-fs-submit-close" type="button">
          Save & close <span class="kbd">⇧⌘↵</span>
        </button>
      </footer>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/capture-overlay.js"></script>
<script>
  // /capture/ standalone — auto-open the overlay, redirect home on close.
  // The overlay HTML in this page is rendered open by default; init wires up
  // event handlers and behavior. On save-and-close, redirect home so the
  // user's stream shows the new save.
  if (window.CaptureOverlay) {
    window.CaptureOverlay.init({
      onSaved: ({ thenClose }) => {
        if (thenClose) {
          window.location.href = '/';
        }
        // Continue mode: stays on this page, no nav.
      },
    });
  }
  // The "×" close button is just a link to home — handled by browser.
</script>
</body>
</html>
