<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Phrasebook · Atlas — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav">
    <a href="/" data-auth="in">Home</a>
    <a href="/trips.html" data-auth="in">Trips</a>
    <a href="/index/">Index</a>
    <a href="/atlas/" class="is-active">Atlas</a>
    <a href="/login.html" data-auth="out">Sign in</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/" data-auth="in">Home</a>
    <a href="/trips.html" data-auth="in">Trips</a>
    <a href="/index/">Index</a>
    <a href="/atlas/" class="is-active">Atlas</a>
    <a href="/admin/" data-auth="in">Admin</a>
    <a href="/settings.html" data-auth="in">Settings</a>
    <a href="/login.html" data-auth="out">Sign in</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<main class="page page-phrasebook">

  <header class="pb-mast">
    <a href="/atlas/" class="pb-back">← atlas</a>
    <h1 class="pb-title">Phrasebook</h1>
    <p class="pb-thesis">Politeness + nouns + confidence. Not grammar perfection.</p>
  </header>

  <div class="pb-filters" id="pb-filters">
    <button class="pb-filter is-active" data-lang="all">All</button>
    <!-- language buttons injected by JS -->
  </div>

  <div id="pb-content">
    <div class="pb-loading">Loading…</div>
  </div>

</main>

<footer class="foot">
  <div class="foot__bar">
    <div class="foot__left">
      <a class="ver" href="/idle/" title="snake">kit v0.5.1</a>
    </div>
    <div class="foot__right">
      <a href="https://summer-holiday.com" class="hide-sm" target="_blank" rel="noopener">Summer Holiday ↗</a>
      <a href="/settings.html" data-auth="in">Settings</a>
      <a href="/admin/" data-auth="in">Admin</a>
      <a href="#" id="signout-link-foot" data-auth="in">Sign out</a>
    </div>
  </div>
</footer>

<style>
  .page-phrasebook { padding-top: 56px; }
  @media (max-width: 720px) { .page-phrasebook { padding-top: 32px; } }

  .pb-mast { margin-bottom: 32px; }
  .pb-back {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-block;
    margin-bottom: 18px;
  }
  .pb-back:hover { color: var(--blue); }
  .pb-title {
    font-size: clamp(40px, 5vw, 64px);
    font-weight: 500;
    letter-spacing: -0.035em;
    margin: 0 0 16px;
    line-height: 1;
  }
  .pb-thesis {
    font-size: 15px;
    color: var(--ink-2);
    font-style: italic;
    max-width: 540px;
    margin: 0;
    letter-spacing: -0.005em;
  }

  .pb-filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    padding: 14px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin-bottom: 36px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .pb-filter {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-2);
    padding: 4px 12px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 140ms ease;
  }
  .pb-filter:hover { color: var(--ink); }
  .pb-filter.is-active { color: var(--ink); font-weight: 500; }
  .pb-filter.is-active::after {
    content: "";
    display: block;
    width: 100%;
    height: 1px;
    background: var(--ink);
    margin-top: 2px;
  }
  .pb-flag { margin-right: 6px; font-size: 13px; }

  .pb-tier { margin-bottom: 56px; }
  .pb-tier__head { margin-bottom: 24px; max-width: 720px; }
  .pb-tier__label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .pb-tier__title {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin: 0 0 8px;
    line-height: 1.1;
  }
  .pb-tier__sub {
    font-size: 14px;
    color: var(--ink-2);
    margin: 0;
    font-style: italic;
  }

  .pb-phrase {
    padding: 22px 0;
    border-top: 1px solid var(--rule);
    max-width: 820px;
  }
  .pb-phrase:first-of-type { border-top: 1px solid var(--rule); }
  .pb-en {
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.012em;
    margin-bottom: 10px;
  }
  .pb-translations { display: flex; flex-direction: column; gap: 4px; }
  .pb-tx {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px;
    align-items: baseline;
  }
  .pb-tx__lang {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pb-tx__text {
    font-size: 16px;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .pb-loading {
    padding: 40px 0;
    color: var(--ink-3);
    font-style: italic;
  }

  /* When a single language is filtered, drop the language column */
  .pb-content.is-single .pb-tx {
    grid-template-columns: 1fr;
  }
  .pb-content.is-single .pb-tx__lang { display: none; }
  .pb-content.is-single .pb-en { font-size: 15px; color: var(--ink-3); margin-bottom: 4px; font-weight: 400; }
  .pb-content.is-single .pb-tx__text { font-size: 22px; font-weight: 500; }

  @media (max-width: 720px) {
    .pb-tx { grid-template-columns: 80px 1fr; gap: 10px; }
    .pb-en { font-size: 16px; }
    .pb-tx__text { font-size: 15px; }
    .pb-content.is-single .pb-tx__text { font-size: 18px; }
  }
</style>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script>
(async function () {
  const filtersEl = document.getElementById('pb-filters');
  const contentEl = document.getElementById('pb-content');

  let data = null;
  let activeLang = 'all';

  try {
    const res = await fetch('/atlas/phrasebook.json');
    data = await res.json();
  } catch (err) {
    contentEl.innerHTML = '<div class="pb-loading">Could not load phrasebook.</div>';
    return;
  }

  // Build language filter buttons
  data.languages.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'pb-filter';
    btn.dataset.lang = l.code;
    btn.innerHTML = '<span class="pb-flag">' + l.flag + '</span>' + l.name;
    btn.addEventListener('click', () => {
      activeLang = l.code;
      filtersEl.querySelectorAll('.pb-filter').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      render();
    });
    filtersEl.appendChild(btn);
  });
  // 'All' button click handler
  filtersEl.querySelector('[data-lang="all"]').addEventListener('click', (e) => {
    activeLang = 'all';
    filtersEl.querySelectorAll('.pb-filter').forEach(b => b.classList.remove('is-active'));
    e.currentTarget.classList.add('is-active');
    render();
  });

  function langLabel(code) {
    const lang = data.languages.find(l => l.code === code);
    return lang ? lang.name : code;
  }
  function langOrder() {
    return data.languages.map(l => l.code);
  }

  function render() {
    const isSingle = activeLang !== 'all';
    contentEl.className = 'pb-content' + (isSingle ? ' is-single' : '');
    let html = '';

    data.tiers.forEach(tier => {
      html += '<section class="pb-tier">';
      html += '<header class="pb-tier__head">';
      html += '<div class="pb-tier__label">' + escapeHtml(tier.id) + '</div>';
      html += '<h2 class="pb-tier__title">' + escapeHtml(tier.label) + '</h2>';
      if (tier.subtitle) html += '<p class="pb-tier__sub">' + escapeHtml(tier.subtitle) + '</p>';
      html += '</header>';

      tier.phrases.forEach(p => {
        html += '<div class="pb-phrase">';
        html += '<div class="pb-en">' + escapeHtml(p.en) + '</div>';
        html += '<div class="pb-translations">';
        const codes = isSingle ? [activeLang] : langOrder();
        codes.forEach(code => {
          if (!p[code]) return;
          html += '<div class="pb-tx">';
          html += '<span class="pb-tx__lang">' + escapeHtml(langLabel(code)) + '</span>';
          html += '<span class="pb-tx__text">' + escapeHtml(p[code]) + '</span>';
          html += '</div>';
        });
        html += '</div>';
        html += '</div>';
      });

      html += '</section>';
    });

    contentEl.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  render();

  const signOutFoot = document.getElementById('signout-link-foot');
  if (signOutFoot) signOutFoot.addEventListener('click', (e) => { e.preventDefault(); api.signOut(); });
})();
</script>
</body>
</html>
