</main>

    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script>
(function () {
  // Five default cities. Order: west to east.
  const cities = [
    { name: 'Los Angeles', tz: 'America/Los_Angeles' },
    { name: 'Paris',       tz: 'Europe/Paris' },
    { name: 'Rome',        tz: 'Europe/Rome' },
    { name: 'Bali',        tz: 'Asia/Makassar' },
    { name: 'Melbourne',   tz: 'Australia/Melbourne' },
  ];

  const listEl = document.getElementById('time-list');

  // Build static row scaffolding
  listEl.innerHTML = cities.map(c => `
    <div class="time-row" data-tz="${c.tz}">
      <span class="time-row__name">${c.name}</span>
      <span class="time-row__time" data-time>—</span>
      <span class="time-row__meta" data-meta>—</span>
    </div>
  `).join('');

  // Local timezone for offset calculation
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  function offsetFromLocal(tz) {
    // Compute the difference in hours by formatting current time in both zones
    const now = new Date();
    const localStr = now.toLocaleString('en-US', { timeZone: localTz });
    const otherStr = now.toLocaleString('en-US', { timeZone: tz });
    const diffMs = new Date(otherStr) - new Date(localStr);
    const hours = Math.round(diffMs / 3600000 * 2) / 2; // half-hour precision
    return hours;
  }

  function tick() {
    cities.forEach(c => {
      const row = listEl.querySelector(`[data-tz="${c.tz}"]`);
      if (!row) return;

      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        timeZone: c.tz,
        hour: 'numeric', minute: '2-digit', hour12: true,
      });

      // Day of week — abbreviated
      const dayLabel = now.toLocaleDateString('en-US', {
        timeZone: c.tz,
        weekday: 'short',
      });

      const off = offsetFromLocal(c.tz);
      let offLabel = '';
      if (off === 0) offLabel = 'same as you';
      else if (off > 0) offLabel = `+${off}h`;
      else offLabel = `${off}h`;

      row.querySelector('[data-time]').textContent = time;
      row.querySelector('[data-meta]').textContent = `${dayLabel} · ${offLabel}`;
    });
  }
  tick();
  setInterval(tick, 30 * 1000);

  const signOutFoot = document.getElementById('signout-link-foot');
  if (signOutFoot) signOutFoot.addEventListener('click', (e) => { e.preventDefault(); api.signOut(); });
})();
</script>
</body>
