<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Add phrase — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/home.css"><!-- capture-fs__* overlay styles -->
  <link rel="stylesheet" href="/css/phrases.css"><!-- small phrase-specific tweaks -->
  <style>
    /* Standalone /phrases/capture/ page: chrome-less full-bleed overlay,
       same approach as /capture/. Mirrors capture-page-host. */
    body { background: var(--bg); }
    .capture-page-host {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<main class="capture-page-host">
  <!-- Reuses capture-fs__* class structure for pixel-identical visuals.
       Differences from /capture/: bind row uses category picker (not city);
       no been/want toggle; foot has a single Save button instead of two. -->
  <div class="capture-fs is-open" id="phrase-fs" aria-hidden="false">
    <div class="capture-fs__inner">
      <header class="capture-fs__head">
        <a href="/phrases/" class="btn-close-circle" aria-label="Close">×</a>
      </header>

      <div class="capture-fs__bind">
        <div class="capture-fs__bind-row">
          <span class="capture-fs__bind-label">In</span>
          <button class="capture-fs__city-btn" id="pf-cat-btn" type="button">
            <span id="pf-cat-name">Coffee</span>
            <span class="capture-fs__city-caret" aria-hidden="true">▾</span>
          </button>
        </div>
        <div class="capture-fs__city-popover" id="pf-cat-popover">
          <div class="capture-fs__city-list" id="pf-cat-list"></div>
        </div>
      </div>

      <div class="capture-fs__body">
        <textarea
          class="capture-fs__textarea"
          id="pf-textarea"
          placeholder="A flat white with oat milk."
          autocomplete="off"
          spellcheck="false"
          rows="1"
        ></textarea>
      </div>

      <footer class="capture-fs__foot">
        <span class="pf-state" id="pf-state"></span>
        <button class="btn" id="pf-save" type="button">
          Save phrase <span class="kbd">⌘↵</span>
        </button>
      </footer>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/phrases-capture.js"></script>
</body>
</html>
