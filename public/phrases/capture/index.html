<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Add phrase — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/phrases.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav">
    <a href="/" data-auth="in">Home</a>
    <a href="/travel/" data-auth="in">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/phrases/" class="is-active" data-auth="in">Phrases</a>
    <a href="/login.html" data-auth="out">Sign in</a>
  </nav>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/" data-auth="in">Home</a>
    <a href="/travel/" data-auth="in">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/guides/" data-auth="in">Guides</a>
    <a href="/phrases/" class="is-active" data-auth="in">Phrases</a>
    <a href="/settings.html" data-auth="in">Settings</a>
    <a href="/admin/" data-auth="in">Admin</a>
    <a href="/login.html" data-auth="out">Sign in</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<main class="page page-phrase-capture">

  <header class="pc-head">
    <h1 class="pc-head__title">Add phrase</h1>
    <a href="/phrases/" class="pc-head__back">← All phrases</a>
  </header>

  <form class="pc-form" id="pc-form" autocomplete="off">

    <div class="pc-row">
      <span class="pc-label">Category</span>
      <div class="pc-cat-row" id="pc-cats"></div>
    </div>

    <div class="pc-row">
      <span class="pc-label">Phrase</span>
      <textarea
        id="pc-text"
        class="pc-input"
        placeholder="A flat white with oat milk."
        rows="2"
        required
      ></textarea>
    </div>

    <div class="pc-actions">
      <button type="submit" class="btn" id="pc-save">Save phrase</button>
      <span class="pc-state" id="pc-state"></span>
    </div>
  </form>

</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/phrases-capture.js"></script>
</body>
</html>
