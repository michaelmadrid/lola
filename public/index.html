<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/themes/pills.css">
  <link rel="stylesheet" href="/css/themes/pills2.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<!-- mobile menu overlay -->
<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
    <div class="menu-overlay__inner"></div>
  </div>

<!-- ============ PAGE ============ -->
<main class="page page-home">

  <!-- LEFT — day summary -->
  <aside class="col-left">
    <div class="day-sum" id="day-sum">

      <div class="day-sum__head">
        <h2 class="day-sum__date" id="day-sum-date">—</h2>
        <div class="day-sum__meta">
          <span class="moon-wrap" id="moon-wrap" title="">
            <svg class="moon" viewBox="0 0 12 12" aria-hidden="true">
              <circle cx="6" cy="6" r="5.5" fill="none" stroke="currentColor" stroke-width="1"/>
              <path id="moon-path" d="" fill="currentColor"/>
            </svg>
          </span>
          <span class="sep">·</span>
          <span class="item" id="day-sum-doy">—</span>
        </div>
      </div>

      <!-- ACTIVE: when on a trip today -->
      <div id="day-active" style="display:none">
        <button class="trip-strip" id="trip-strip" aria-label="Open itinerary">
          <span class="trip-strip__main">
            <span class="trip-strip__name" id="trip-strip-name">—</span>
            <span class="trip-strip__sub">
              <span class="trip-strip__dates" id="trip-strip-dates">—</span>
              <span class="trip-strip__sep" id="trip-strip-sep">·</span>
              <span class="trip-strip__arc" id="trip-strip-arc">—</span>
            </span>
          </span>
          <span class="trip-strip__open">↗</span>
        </button>

        <!-- Mini-month calendar — CdG-style days only -->
        <div class="mm" id="mini-month" aria-hidden="true"></div>

        <div class="trip-now" id="trip-now" style="display:none">
          <div class="trip-now__row" id="trip-now-today" style="display:none">
            <span class="trip-now__label">Today</span>
            <span class="trip-now__value" id="trip-now-today-value">—</span>
          </div>
          <div class="trip-now__row" id="trip-now-next" style="display:none">
            <span class="trip-now__label">Next</span>
            <span class="trip-now__value" id="trip-now-next-value">—</span>
          </div>
        </div>
      </div>

      <!-- IDLE: no trip today -->
      <div id="day-idle" class="day-sum__idle" style="display:none">
        <p class="day-sum__idle__quote" id="idle-quote">—</p>
        <span class="day-sum__idle__caption">OBLIQUE <span id="idle-num">001</span>/180</span>
      </div>

    </div>
  </aside>

  <!-- MIDDLE — capture + recently saved -->
  <div class="col-mid">

    <!-- Capture launcher — looks like a field, behaves like a button.
         Tap opens the fullscreen capture overlay. -->
    <div class="capture-wrap">
      <button class="capture-launcher" id="capture-launcher" type="button" aria-label="Add a spot">
        <span class="capture-launcher__plus" aria-hidden="true">+</span>
        <span class="capture-launcher__placeholder">Add a spot</span>
        <span class="capture-launcher__city" id="capture-launcher-city">
          <span id="capture-launcher-city-name">Bali</span>
          <span class="capture-launcher__city-caret" aria-hidden="true">▾</span>
        </span>
      </button>
    </div>

    <!-- Capture overlay — fullscreen editor.
         Same UI as the standalone /capture/ page; opens when the launcher is tapped. -->
    <div class="capture-fs" id="capture-fs" hidden aria-hidden="true">
      <div class="capture-fs__inner">
        <header class="capture-fs__head">
          <button class="btn-close-circle" id="capture-fs-close" aria-label="Close" type="button">×</button>
        </header>

        <div class="capture-fs__bind">
          <div class="capture-fs__bind-row">
            <span class="capture-fs__bind-label">In</span>
            <button class="capture-fs__city-btn" id="capture-fs-city-btn" type="button">
              <span id="capture-fs-city-btn-name">Bali</span>
              <span class="capture-fs__city-caret" aria-hidden="true">▾</span>
            </button>
          </div>
          <div class="capture-fs__city-popover" id="capture-fs-city-popover">
            <input type="text" class="capture-fs__city-search" id="capture-fs-city-search" placeholder="Type a city…" autocomplete="off">
            <div class="capture-fs__city-list" id="capture-fs-city-list"></div>
          </div>

          <button class="capture-fs__been-btn" id="capture-fs-been-btn" data-been="true" type="button" aria-label="Toggle been or want to go">
            <span id="capture-fs-been-text">I've been here</span>
          </button>
        </div>

        <div class="capture-fs__body">
          <textarea
            class="capture-fs__textarea"
            id="capture-fs-textarea"
            placeholder="Tampopo - try the ramen"
            autocomplete="off"
            spellcheck="false"
            rows="1"
          ></textarea>
        </div>

        <footer class="capture-fs__foot">
          <button class="btn btn--secondary" id="capture-fs-submit-continue" type="button">
            Save & continue <span class="kbd">⌘↵</span>
          </button>
          <button class="btn" id="capture-fs-submit-close" type="button">
            Save & close <span class="kbd">⇧⌘↵</span>
          </button>
        </footer>
      </div>
    </div>

    <section class="stream-section">
      <div class="stream__head">
        <span class="stream__label">Recently saved</span>
      </div>
      <div class="stream" id="stream">
        <div class="stream__empty" id="stream-empty">No saves yet. Type something above.</div>
      </div>
    </section>

  </div>

  <!-- RIGHT — todos -->
  <aside class="col-right">
    <div class="todos">
      <div class="todos__head">
        <span class="todos__label">Today</span>
        <button class="todos__expand" id="todos-expand" aria-label="Open fullscreen">↗</button>
      </div>
      <div class="todo-list" id="todo-list"></div>
      <div class="todos__add-zone" id="add-todo-zone" aria-label="Add todo"></div>
    </div>

    <!-- TEMP — Juice (phrases) link above trip launch.
         Reuses .trip-launch shape so visual is consistent. Shows on mobile only
         (same media-query gate as .trip-launch). Always visible (no hidden gate)
         since /phrases/ has content even when no trip is upcoming. -->
    <a href="/phrases/" class="trip-launch trip-launch--juice">
      <span class="trip-launch__label">Open Juice</span>
      <span class="trip-launch__caret" aria-hidden="true">↗</span>
    </a>

    <!-- Mobile-only affordance to open trip overlay.
         On desktop the trip-strip in the left column does this job;
         on mobile that column is hidden, so we surface this button instead. -->
    <button class="trip-launch" id="trip-launch" type="button" hidden>
      <span class="trip-launch__label" id="trip-launch-label">Open trip</span>
      <span class="trip-launch__caret" aria-hidden="true">↗</span>
    </button>
  </aside>

</main>

<!-- ============ TODO FULLSCREEN EDITOR (all todos) ============ -->
<div class="modal todo-fs" id="todo-editor">
  <div class="modal__head">
    <h3 class="todo-fs__title">TODO</h3>
    <span class="todo-fs__date" id="todo-fs-date">—</span>
    <button class="modal__close" id="todo-editor-close">close</button>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner todo-fs__inner">
      <div class="todo-fs__list" id="todo-fs-list"></div>
      <div class="todo-fs__addzone" id="todo-fs-addzone"></div>
    </div>
  </div>
</div>

<!-- ============ ITINERARY OVERLAY ============ -->
<div class="modal itin-fs" id="itin-overlay">
  <div class="modal__head itin-fs__head-bar">
    <button class="btn-close-circle" id="itin-close" aria-label="Close" type="button">×</button>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner itin-fs__inner">
      <header class="itin-fs__head">
        <h1 class="itin-fs__title" id="itin-title">—</h1>
        <p class="itin-fs__dates" id="itin-dates">—</p>
      </header>
      <div id="itin-meta" class="itin-fs__meta"></div>
      <div id="itin-trip-notes" class="itin-fs__trip-notes"></div>
      <div id="itin-segments" class="itin-fs__segments"></div>
      <div class="itin-fs__placeholders">
        <p class="itin-fs__placeholder">Flights, hotels, and notes coming soon. For now, edit segments and trip details on the trip page.</p>
        <a class="itin-fs__edit-link" id="itin-edit-link" href="#">Open trip page →</a>
      </div>
    </div>
  </div>
</div>

<!-- ============ SAVE EDITOR ============ -->
<div class="modal save-fs" id="save-editor">
  <div class="modal__head save-fs__head">
    <button class="btn-close-circle" id="save-editor-close" aria-label="Close" type="button">×</button>
    <h3 class="save-fs__title">Edit</h3>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner save-fs__inner">
      <!-- Place name -->
      <div class="save-fs__field">
        <label class="save-fs__label" for="save-fs-place">Place</label>
        <input type="text" class="save-fs__input" id="save-fs-place" placeholder="Place name">
      </div>

      <!-- Tip -->
      <div class="save-fs__field">
        <label class="save-fs__label" for="save-fs-tip">Tip</label>
        <input type="text" class="save-fs__input" id="save-fs-tip" placeholder="Note, advice, what to order…">
      </div>

      <!-- Category -->
      <div class="save-fs__field">
        <label class="save-fs__label" for="save-fs-category">Category</label>
        <select class="save-fs__select" id="save-fs-category">
          <option value="">— none —</option>
          <option value="eat">Eat</option>
          <option value="drink">Drink</option>
          <option value="coffee">Coffee</option>
          <option value="stay">Stay</option>
          <option value="shop">Shop</option>
          <option value="see">See</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Been / Want to go -->
      <div class="save-fs__field">
        <label class="save-fs__label">Status</label>
        <div class="save-fs__been-row">
          <button type="button" class="save-fs__been-pill" id="save-fs-been-yes" data-active="true">I've been here</button>
          <button type="button" class="save-fs__been-pill" id="save-fs-been-no" data-active="false">I want to go</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal__foot save-fs__foot">
    <button class="save-fs__danger" id="save-fs-delete">Delete</button>
    <button class="btn" id="save-fs-save">Save<span class="kbd">⌘ ↵</span></button>
  </div>
</div>

<!-- ============ FOOTER ============ -->
<!-- Year-view calendar overlay (CdG style) -->
<div class="year-overlay" id="year-overlay" aria-hidden="true">
  <div class="year-overlay__inner">
    <div class="year-overlay__head">
      <h2 class="year-overlay__title" id="year-overlay-title">—</h2>
      <button class="year-overlay__close" id="year-overlay-close" aria-label="Close">×</button>
    </div>
    <div class="year-overlay__grid" id="year-months"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/oblique.js"></script>
<script src="/js/capture-overlay.js"></script>
<script src="/js/home.js"></script>
<script src="/js/nav.js"></script>
</body>
</html>
