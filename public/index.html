<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>lola</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">lola</a>
  </div>
  <nav class="nav">
    <a href="/" class="is-active">Home</a>
    <a href="/trips.html">Trips</a>
    <a href="/index/">Index</a>
    <a href="/idle/">Idle</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<!-- mobile menu overlay -->
<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/" class="is-active">Home</a>
    <a href="/trips.html">Trips</a>
    <a href="/index/">Index</a>
    <a href="/idle/">Idle</a>
    <a href="/admin/" data-auth="in">Admin</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<!-- ============ PAGE ============ -->
<main class="page page-home">

  <!-- LEFT — day summary -->
  <aside class="col-left">
    <div class="day-sum" id="day-sum">

      <div class="day-sum__head">
        <h2 class="day-sum__date" id="day-sum-date">—</h2>
        <div class="day-sum__meta">
          <svg class="moon" viewBox="0 0 12 12" aria-hidden="true">
            <circle cx="6" cy="6" r="5.5" fill="none" stroke="currentColor" stroke-width="1"/>
            <path d="M 6 0.5 A 5.5 5.5 0 0 1 6 11.5 A 3.5 5.5 0 0 0 6 0.5 Z" fill="currentColor"/>
          </svg>
          <span class="sep">·</span>
          <span class="item" id="day-sum-weather">—</span>
        </div>
      </div>

      <!-- ACTIVE: when on a trip today -->
      <div id="day-active" style="display:none">
        <div class="day-sum__where-line" id="day-trip-context"></div>

        <div class="day-sum__section" id="day-segments-section" style="display:none">
          <div class="day-sum__section__label">Travel</div>
          <div id="day-segments"></div>
        </div>

        <div class="day-sum__section">
          <div class="day-sum__section__label">Note</div>
          <button class="note-btn" id="note-open">
            <span class="note-btn__preview" id="note-preview">write today</span>
            <span class="note-btn__arrow">→</span>
          </button>
        </div>
      </div>

      <!-- IDLE: no trip today -->
      <div id="day-idle" class="day-sum__idle" style="display:none">
        <svg id="idle-svg" class="day-sum__idle__svg" viewBox="0 0 200 160" aria-hidden="true"></svg>
        <p class="day-sum__idle__quote" id="idle-quote">—</p>
        <span class="day-sum__idle__caption">OBLIQUE <span id="idle-num">001</span>/180</span>
      </div>

    </div>
  </aside>

  <!-- MIDDLE — capture + recently saved -->
  <div class="col-mid">

    <div class="capture-wrap">
      <div class="capture">
        <span class="capture__plus" aria-hidden="true">+</span>
        <input
          type="text"
          class="capture__input"
          id="capture-input"
          placeholder="a place, a thought…"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="capture__send" id="capture-send" aria-label="Save">save ↵</button>
      </div>
      <div class="capture__tags" id="capture-tags"></div>
    </div>

    <section class="stream-section">
      <div class="stream__head">
        <span class="stream__label">Recently saved</span>
        <a href="#" class="stream__more" id="stream-more">all saves ↗</a>
      </div>
      <div class="stream" id="stream">
        <div class="stream__empty" id="stream-empty">No saves yet. Type something above.</div>
      </div>
    </section>

  </div>

  <!-- RIGHT — todos (in-memory for V1) -->
  <aside class="col-right">
    <div class="todos">
      <div class="todos__label">Today</div>
      <div class="todo-list" id="todo-list"></div>
      <div class="todos__add-zone" id="add-todo-zone" aria-label="Add todo"></div>
    </div>
  </aside>

</main>

<!-- ============ NOTE OVERLAY EDITOR ============ -->
<div class="modal" id="note-overlay">
  <div class="modal__head">
    <h3 class="modal__title">Note · <strong id="note-date">—</strong></h3>
    <button class="modal__close" id="note-close">close</button>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner">
      <textarea
        class="note-textarea"
        id="note-text"
        placeholder="write today…"
        spellcheck="true"
      ></textarea>
    </div>
  </div>
  <div class="modal__foot">
    <span id="note-status">esc to close</span>
    <button class="save-btn" id="note-save">save ↵</button>
  </div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="foot">
  <div class="foot__bar">
    <div class="foot__left">
      <span class="ver">lola v0.5.0</span>
    </div>
    <div class="foot__right">
      <a href="https://summer-holiday.com" class="hide-sm" target="_blank" rel="noopener">Summer Holiday ↗</a>
      <a href="/admin/" data-auth="in">Admin</a>
      <a href="#" id="signout-link-foot" data-auth="in">Sign out</a>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/oblique.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
