<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");}}catch(e){}</script>
  <title>Notes — annex</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/spots.css">
  <link rel="stylesheet" href="/css/uploader.css">
  <!-- Quill rich text editor (for Article note bodies) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">annex</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
  <div class="menu-overlay__inner"></div>
</div>

<main class="page page-spots page-notes">

  <header class="mast">
    <div class="mast__head">
      <div>
        <h1 class="mast__title">Notes</h1>
        <p class="mast__count" id="note-count"></p>
      </div>
      <div class="mast__head-right">
        <button class="btn" id="note-add-btn" type="button">+ Add a note</button>
      </div>
    </div>
  </header>

  <input type="text" class="search-input" id="notes-search" placeholder="Search by name…" autocomplete="off">

  <div class="spots-filters">
    <!-- View filter as a picker dropdown, far left (status is the primary slice
         for notes; also keeps the popover from overflowing the right edge) -->
    <div class="picker-group">
      <button class="picker-btn" id="view-picker-btn" type="button" aria-haspopup="true">
        <span class="picker-btn__label" id="view-picker-label">All</span>
        <span class="picker-btn__caret" aria-hidden="true">▾</span>
      </button>
      <div class="picker-popover" id="view-picker-popover" hidden>
        <div class="picker-list" id="view-picker-list"></div>
      </div>
    </div>
  </div>

  <div class="bulk-bar" id="bulk-bar" hidden>
    <span class="bulk-bar__count" id="bulk-count">0 selected</span>
    <div class="bulk-bar__actions">
      <button class="btn btn--small" id="bulk-publish">Publish</button>
      <button class="btn btn--small btn--secondary" id="bulk-draft">Make draft</button>
      <button class="btn btn--small btn--ghost btn--danger" id="bulk-trash">Move to trash</button>
      <button class="btn btn--small btn--ghost" id="bulk-restore" hidden>Restore</button>
      <button class="btn btn--small btn--ghost btn--danger" id="bulk-delete-forever" hidden>Delete forever</button>
      <button class="bulk-bar__cancel" id="bulk-clear">Clear</button>
    </div>
  </div>

  <div class="stream spots-grid" id="notes-list"><div class="stream__empty">Loading…</div></div>

</main>

<!-- Note editor -->
<div class="modal spot-fs" id="note-editor">
  <div class="modal__head spot-fs__head">
    <button class="btn-close-circle" id="note-editor-close" aria-label="Close" type="button">×</button>
    <h3 class="spot-fs__title">Note</h3>
    <a id="note-permalink" class="note-permalink-link" href="#" target="_blank" rel="noopener" hidden>View ↗</a>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner spot-fs__inner">

      <div class="spot-fs__field">
        <label class="spot-fs__label">Type</label>
        <div class="spot-fs__been-row" id="note-type-row">
          <button type="button" class="spot-fs__been-pill" data-type="note">Note</button>
          <button type="button" class="spot-fs__been-pill" data-type="photograph">Photograph</button>
          <button type="button" class="spot-fs__been-pill" data-type="link">Link</button>
          <button type="button" class="spot-fs__been-pill" data-type="article">Article</button>
        </div>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-headline">Headline</label>
        <input type="text" class="spot-fs__input" id="note-headline" placeholder="The title shown on the front page">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-body">Body</label>
        <textarea class="spot-fs__input" id="note-body" rows="4" placeholder="Optional supporting text…" style="resize: vertical; min-height: 90px;"></textarea>
        <!-- Rich editor for Article type (Quill mounts here) -->
        <div id="note-body-rich" class="note-rich" hidden>
          <div id="note-quill-toolbar">
            <button class="ql-bold"></button>
            <button class="ql-italic"></button>
            <button class="ql-link"></button>
            <button class="ql-blockquote"></button>
            <select class="ql-align">
              <option selected></option>
              <option value="center"></option>
              <option value="right"></option>
              <option value="justify"></option>
            </select>
          </div>
          <div id="note-quill-editor"></div>
        </div>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label">Image</label>
        <div class="uploader" id="note-fs-uploader">
          <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
          <div class="uploader__preview"></div>
          <button type="button" class="uploader__btn">Upload image</button>
          <button type="button" class="uploader__btn uploader__btn--remove" id="note-image-remove" hidden>Remove image</button>
        </div>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-ref-url">URL (optional)</label>
        <input type="url" class="spot-fs__input" id="note-ref-url" placeholder="https://…">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-ref-title">Optional caption / reference</label>
        <input type="text" class="spot-fs__input" id="note-ref-title" placeholder="Caption or source name">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-category">Category</label>
        <select class="spot-fs__select" id="note-category">
          <option value="">— none —</option>
        </select>
        <p class="spot-fs__hint">Manage the list in Studio Admin → Notes → Categories.</p>
      </div>

      <div class="spot-fs__divider"></div>

      <div class="spot-fs__field">
        <label class="spot-fs__label">Pin</label>
        <div class="spot-fs__been-row">
          <button type="button" class="spot-fs__been-pill" id="note-pin-off" data-active="true">Normal</button>
          <button type="button" class="spot-fs__been-pill" id="note-pin-on" data-active="false">Pinned to top</button>
        </div>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label">Show in feed</label>
        <div class="spot-fs__been-row">
          <button type="button" class="spot-fs__been-pill" id="note-feed-on" data-active="true">In feed</button>
          <button type="button" class="spot-fs__been-pill" id="note-feed-off" data-active="false">Off feed (page only)</button>
        </div>
        <p class="spot-fs__hint">Off-feed notes still have a shareable permalink — they just don't appear on the homepage feed. Good for articles.</p>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-publish-date">Publish date</label>
        <input type="datetime-local" class="spot-fs__input" id="note-publish-date">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="note-expires">Expires (optional)</label>
        <div class="note-expires-row">
          <input type="datetime-local" class="spot-fs__input" id="note-expires">
          <button type="button" class="btn btn--small btn--ghost" id="note-expires-clear">Clear</button>
        </div>
      </div>

    </div>
  </div>
  <div class="modal__foot spot-fs__foot">
    <button class="spot-fs__danger" id="note-delete">Delete</button>
    <span style="flex:1"></span>
    <button class="btn btn--secondary" id="note-save-draft">Save draft</button>
    <button class="btn" id="note-publish">Publish</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/uploader.js"></script>
<script src="/js/notes.js"></script>
</body>
</html>
