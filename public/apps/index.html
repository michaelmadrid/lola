<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Apps — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/apps.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">annex</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
  <div class="menu-overlay__inner"></div>
</div>

<main class="page page-apps">

  <header class="apps-mast">
    <h1 class="apps-mast__title">Apps</h1>
    <p class="apps-mast__sub">Little tools and experiments inside kit.</p>
  </header>

  <div class="apps-grid">
    <a href="/apps/snake/" class="app-card">
      <h2 class="app-card__name">Snake</h2>
      <p class="app-card__desc">Idle game. Eat the dots.</p>
    </a>
  </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/shell.js"></script>
</body>
</html>
