<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // /pass.html            → set the pass flag, then go to index (which forwards to home)
  // /pass.html?logout=true → clear the flag, then go to index (shows the splash)
  (function () {
    var params = new URLSearchParams(location.search);
    if (params.get('logout') === 'true') {
      localStorage.removeItem('annex.pass');
    } else {
      localStorage.setItem('annex.pass', '1');
    }
    location.replace('/');
  })();
</script>
</head>
<body></body>
</html>
