<!-- Fixed brand mark + subnav — styling lives in css/shell.css
     (.posto-mark / .posto-subnav). Edit labels/links here; every
     page that includes this partial picks up changes on refresh. -->
<div class="posto-mark" tabindex="0">
  <a href="/"><span class="posto-mark__word">POSTO</span></a>
  <!-- Mobile-only burger block. Hidden at >720px (see shell.css
       "MOBILE NAV"). Sits flush beside the POSTO block, stretched to
       its exact height by the flex row. Tap toggles .is-open. -->
  <button class="posto-burger" type="button" aria-label="Menu" aria-expanded="false">
    <span class="posto-burger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
  <nav class="posto-subnav">
    <a class="posto-subnav__item" href="/shelf">Shelf</a>
    <a class="posto-subnav__item" href="/bookstores?layout=gazette">Bookstores</a>
   <!-- <a class="posto-subnav__item" href="/spots?layout=wall">Field</a> -->
    <a class="posto-subnav__item" href="/info">Info</a>
  </nav>
</div>

<script>
  (function () {


    var NAV_MODE = {
      // static pages, matched via window.POSTO_PAGE
      home:  { open: true,  horz: false },
      spot:  { open: true, horz: false },
      note:  { open: true, horz: false },

      // spots.html layout variants, matched via ?layout=
      'layout:grid':      { open: true,  horz: false  },
      'layout:wall':      { open: true,  horz: false  },
      'layout:gazette':   { open: true,  horz: false },
      'layout:shelf':     { open: false, horz: false },
      'layout:catalogue': { open: false, horz: false }
    };
    var DEFAULT_MODE = { open: true, horz: false };

    var layout = new URLSearchParams(location.search).get('layout');
    var key = layout ? ('layout:' + layout) : (window.POSTO_PAGE || null);
    var mode = (key && NAV_MODE[key]) || DEFAULT_MODE;

    document.body.classList.toggle('nav-open', mode.open);
    document.body.classList.toggle('nav-horz', mode.horz);
  })();
</script>

<script>
  /* Click/tap toggle — works identically on desktop and mobile.
     Hover (CSS only, in shell.css) still works as a bonus on
     desktop, but this is the reliable path everywhere. Runs once
     per page since includes.js recreates this <script> fresh
     after injecting the partial — see js/includes.js. */
  (function () {
    var mark = document.querySelector('.posto-mark');
    var word = document.querySelector('.posto-mark__word');
    var burger = document.querySelector('.posto-burger');
    if (!mark || !word) return;

    function sync() {
      if (burger) burger.setAttribute('aria-expanded', mark.classList.contains('is-open') ? 'true' : 'false');
    }

    word.addEventListener('click', function (e) {
      e.stopPropagation();
      mark.classList.toggle('is-open');
      sync();
    });

    /* Burger owns the toggle on mobile. preventDefault so the tap never
       falls through to the POSTO home link sitting beside it. */
    if (burger) {
      burger.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        mark.classList.toggle('is-open');
        sync();
      });
    }

    /* Tap-away closes. Burger + subnav are inside .posto-mark, so this
       never fires on them. */
    document.addEventListener('click', function (e) {
      if (!mark.contains(e.target)) { mark.classList.remove('is-open'); sync(); }
    });

    /* Following a subnav link closes it too — matters for same-page
       navigations where the partial isn't re-injected. */
    mark.addEventListener('click', function (e) {
      if (e.target.closest('.posto-subnav__item')) { mark.classList.remove('is-open'); sync(); }
    });

  })();
</script>
