<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Trips — lola</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/trip.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">lola</a>
  </div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/trips.html" class="is-active">Trips</a>
    <a href="/index/">Index</a>
    <a href="/idle/">Idle</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/">Home</a>
    <a href="/trips.html" class="is-active">Trips</a>
    <a href="/index/">Index</a>
    <a href="/idle/">Idle</a>
    <a href="/settings.html" data-auth="in">Settings</a>
      <a href="/admin/" data-auth="in">Admin</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<main class="page page-trips">

  <header class="trips-mast">
    <h1 class="trips-mast__title">Trips</h1>
    <button class="btn" id="new-trip-btn">+ New trip</button>
  </header>

  <div class="trip-list" id="trip-list">
    <div class="list-empty" id="trips-empty">Loading…</div>
  </div>

</main>

<!-- New / edit trip modal -->
<div class="modal" id="trip-modal">
  <div class="modal__head">
    <h3 class="modal__title">New trip</h3>
    <button class="modal__close" id="trip-modal-close">close</button>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner">
      <form id="trip-form">
        <div class="field">
          <label class="field__label" for="t-name">Name</label>
          <input class="field__input" id="t-name" required placeholder="Europe '26">
        </div>
        <div class="field__row">
          <div class="field">
            <label class="field__label" for="t-date-start">Start date</label>
            <input class="field__input" id="t-date-start" type="date">
          </div>
          <div class="field">
            <label class="field__label" for="t-date-end">End date</label>
            <input class="field__input" id="t-date-end" type="date">
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="t-notes">Notes (optional)</label>
          <textarea class="field__textarea" id="t-notes" rows="4"></textarea>
        </div>
      </form>
    </div>
  </div>
  <div class="modal__foot">
    <span>esc to close</span>
    <button class="save-btn" id="trip-save">save ↵</button>
  </div>
</div>

<footer class="foot">
  <div class="foot__bar">
    <div class="foot__left">
      <span class="ver">lola v0.5.0</span>
    </div>
    <div class="foot__right">
      <a href="https://summer-holiday.com" class="hide-sm" target="_blank" rel="noopener">Summer Holiday ↗</a>
      <a href="/settings.html" data-auth="in">Settings</a>
      <a href="/admin/" data-auth="in">Admin</a>
      <a href="#" id="signout-link-foot" data-auth="in">Sign out</a>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/trips.js"></script>
</body>
</html>
