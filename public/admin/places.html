<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Places · Admin — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/travel/">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/index/">Index</a>
    <a href="/admin/" class="is-active">Admin</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/">Home</a>
    <a href="/travel/">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/index/">Index</a>
    <a href="/admin/" class="is-active">Admin</a>
    <a href="#" id="signout-link" class="menu-overlay__signout">Sign out</a>
  </div>
</div>

<main class="page page-admin">

  <header class="admin-head">
    <h1 class="admin-head__title">Places</h1>
    <div style="display:flex; gap:12px">
      <a href="/admin/" class="btn--secondary">← admin</a>
      <button class="btn" id="add-place-btn">+ Add place</button>
    </div>
  </header>

  <input type="text" class="admin-search" id="search-input" placeholder="search places…">

  <div class="admin-table">
    <div class="admin-table__head places-head">
      <span>Name</span>
      <span>City</span>
      <span>Country</span>
      <span>Category</span>
      <span>Actions</span>
    </div>
    <div id="places-list">
      <div class="list-empty">Loading…</div>
    </div>
  </div>

</main>

<!-- Add/edit place modal -->
<div class="modal" id="place-modal">
  <div class="modal__head">
    <h3 class="modal__title" id="place-modal-title">Add place</h3>
    <button class="modal__close" id="place-modal-close">close</button>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner">
      <form id="place-form">
        <div class="field">
          <label class="field__label" for="p-name">Name *</label>
          <input class="field__input" id="p-name" required>
        </div>
        <div class="field__row">
          <div class="field">
            <label class="field__label" for="p-category">Category *</label>
            <select class="field__select" id="p-category" required>
              <option value="bookshop">Bookshop</option>
              <option value="coffee">Coffee</option>
              <option value="film-lab">Film lab</option>
              <option value="gallery">Gallery</option>
              <option value="hotel">Hotel</option>
              <option value="restaurant">Restaurant</option>
              <option value="shop">Shop</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="p-city">City</label>
            <select class="field__select" id="p-city">
              <option value="">— select —</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="p-address">Address</label>
          <input class="field__input" id="p-address" placeholder="Street, postcode">
        </div>
        <div class="field">
          <label class="field__label" for="p-maps">Maps URL</label>
          <input class="field__input" id="p-maps" placeholder="https://maps.google.com/...">
        </div>
        <div class="field">
          <label class="field__label" for="p-url">Website</label>
          <input class="field__input" id="p-url" placeholder="https://...">
        </div>
        <div class="field">
          <label class="field__label" for="p-description">Description</label>
          <textarea class="field__textarea" id="p-description" rows="3"></textarea>
        </div>
        <div class="field">
          <label class="field__label" for="p-hours">Hours</label>
          <input class="field__input" id="p-hours" placeholder="Tue–Sat 11–7">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px">
          <button type="button" class="btn btn--secondary" id="delete-place-btn" style="color:#c0392b; display:none">Delete place</button>
        </div>
      </form>
    </div>
  </div>
  <div class="modal__foot">
    <span>esc to close</span>
    <button class="save-btn" id="place-save">Save<span class="kbd">⌘ ↵</span></button>
  </div>
</div>

<footer class="foot">
  <div class="foot__bar">
    <div class="foot__left">
      <a class="ver" href="/idle/" title="snake">kit v0.5.1</a>
    </div>
    <div class="foot__right">
      <a href="/settings.html">Settings</a>
      <a href="#" id="signout-link-foot">Sign out</a>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/admin-places.js"></script>
</body>
</html>
