<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");}catch(e){}</script>
  <title>Review Spots · Admin — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
  <div class="menu-overlay__inner"></div>
</div>

<main class="page page-admin">

  <header class="admin-head">
    <div>
      <div class="admin-head__breadcrumb"><a href="/admin/">Admin</a> / Spots</div>
      <h1 class="admin-head__title">Review Spots</h1>
    </div>
  </header>

  <!-- Sub-nav -->
  <nav class="admin-subnav">
    <a href="/admin/spots-curated.html" class="admin-subnav__link">Curated</a>
    <a href="/admin/spots-review.html" class="admin-subnav__link is-active">Review</a>
  </nav>

  <!-- Bulk bar -->
  <div class="bulk-bar" id="bulk-bar" hidden>
    <span class="bulk-bar__count" id="bulk-count">0 selected</span>
    <div class="bulk-bar__actions">
      <button class="bulk-bar__cancel" id="bulk-cancel">Clear</button>
      <button class="bulk-bar__delete" id="bulk-delete">Delete selected</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="admin-controls">
    <input type="text" class="admin-search" id="search-input" placeholder="Search spots…">
  </div>

  <div class="admin-table">
    <div class="admin-table__head spots-head">
      <span class="col-check"><input type="checkbox" id="check-all" aria-label="Check all"></span>
      <span>Text</span>
      <span>Tags</span>
      <span>When</span>
      <span>Actions</span>
    </div>
    <div id="spots-list">
      <div class="list-empty">Loading…</div>
    </div>
  </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin-spots.js"></script>
<script>
  if (!api.isSignedIn()) location.href = '/login.html?next=' + encodeURIComponent(location.pathname);
</script>
</body>
</html>
