<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");}}catch(e){}</script>
  <title>Cities · Admin — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/spots.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
  <div class="menu-overlay__inner"></div>
</div>

<main class="page page-admin">

  <header class="admin-head">
    <div>
      <div class="admin-head__breadcrumb"><a href="/admin/">Admin</a> / Cities</div>
      <h1 class="admin-head__title">Cities</h1>
    </div>
    <button class="btn" id="add-city-btn">+ Add city</button>
  </header>

  <div class="admin-controls">
    <input type="text" class="admin-search" id="search-input" placeholder="Search cities…">
    <select class="select" id="status-filter">
      <option value="">All statuses</option>
      <option value="3">★ Featured</option>
      <option value="1">Auto</option>
      <option value="2">Pending</option>
    </select>
  </div>

  <div class="admin-table">
    <div class="admin-table__head cities-head">
      <span>Name</span>
      <span>Country</span>
      <span>Timezone</span>
      <span>Status</span>
      <span>Actions</span>
    </div>
    <div id="cities-list"><div class="list-empty">Loading…</div></div>
  </div>

</main>

<!-- Editor overlay -->
<div class="modal spot-fs" id="city-editor">
  <div class="modal__head spot-fs__head">
    <button class="btn-close-circle" id="city-editor-close" aria-label="Close" type="button">×</button>
    <h3 class="spot-fs__title" id="city-editor-title">Add city</h3>
  </div>
  <div class="modal__body">
    <div class="modal__body__inner spot-fs__inner">

      <div class="spot-fs__field" id="city-resolve-field">
        <label class="spot-fs__label">Find city</label>
        <div class="maps-link__editor" style="margin-top:0">
          <input type="text" class="spot-fs__input" id="city-resolve-input" placeholder="Type a city, e.g. Paris">
          <div class="maps-link__editor-actions">
            <button type="button" class="btn btn--small" id="city-resolve-btn">Search Google</button>
          </div>
          <div id="city-resolve-results"></div>
        </div>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="c-name">Name</label>
        <input type="text" class="spot-fs__input" id="c-name">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="c-country">Country</label>
        <input type="text" class="spot-fs__input" id="c-country" placeholder="France">
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label" for="c-timezone">Timezone</label>
        <select class="spot-fs__select" id="c-timezone"></select>
      </div>

      <div class="spot-fs__field">
        <label class="spot-fs__label">Status</label>
        <div class="spot-fs__been-row">
          <button type="button" class="spot-fs__been-pill" id="c-status-featured" data-status="3">★ Featured</button>
          <button type="button" class="spot-fs__been-pill" id="c-status-auto" data-status="1">Normal</button>
          <button type="button" class="spot-fs__been-pill" id="c-status-pending" data-status="2">Pending</button>
        </div>
      </div>

      <div class="spot-fs__field">
        <label style="display:flex; gap:10px; align-items:center; cursor:pointer">
          <input type="checkbox" id="c-is-region">
          <span style="font-size:13px; color:var(--ink-2)">This is a region/island, not a city (e.g. Bali, Tuscany)</span>
        </label>
      </div>

    </div>
  </div>
  <div class="modal__foot spot-fs__foot">
    <button class="spot-fs__danger" id="city-delete" style="display:none">Delete</button>
    <button class="btn" id="city-save">Save<span class="kbd">⌘ ↵</span></button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin-cities.js"></script>
</body>
</html>
