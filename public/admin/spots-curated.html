<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");}catch(e){}</script>
  <title>Curated Spots · Admin — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
  <div class="menu-overlay__inner"></div>
</div>

<main class="page page-admin">

  <header class="admin-head">
    <div>
      <div class="admin-head__breadcrumb"><a href="/admin/">Admin</a> / Spots</div>
      <h1 class="admin-head__title">Curated Spots</h1>
    </div>
  </header>

  <!-- Sub-nav -->
  <nav class="admin-subnav">
    <a href="/admin/spots-curated.html" class="admin-subnav__link is-active">Curated</a>
    <a href="/admin/spots-review.html" class="admin-subnav__link">Review</a>
  </nav>

  <!-- Controls -->
  <div class="admin-controls">
    <input type="text" class="admin-search" id="search-input" placeholder="Search curated spots…">
    <select class="admin-filter select" id="category-filter">
      <option value="">All categories</option>
      <option value="bookstore">Bookstore</option>
      <option value="film_lab">Film Lab</option>
      <option value="coffee">Coffee</option>
      <option value="eat">Eat</option>
      <option value="drink">Drink</option>
      <option value="shop">Shop</option>
      <option value="see">See</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div class="admin-table">
    <div class="admin-table__head curated-head">
      <span>Place</span>
      <span>City</span>
      <span>Category</span>
      <span>Image</span>
      <span>Actions</span>
    </div>
    <div id="spots-list">
      <div class="list-empty">Loading…</div>
    </div>
  </div>

</main>

<!-- Edit overlay -->
<div class="modal save-fs" id="edit-overlay" hidden>
  <div class="save-fs__inner">
    <header class="save-fs__head">
      <button class="btn-close-circle" id="edit-close">×</button>
      <h2 class="save-fs__title" id="edit-title">Edit Spot</h2>
    </header>
    <div class="save-fs__body">
      <div class="save-fs__field">
        <label class="save-fs__label">Place name</label>
        <input type="text" class="input" id="edit-place-name">
      </div>
      <div class="save-fs__field">
        <label class="save-fs__label">Tip</label>
        <textarea class="textarea" id="edit-tip" rows="3"></textarea>
      </div>
      <div class="save-fs__field">
        <label class="save-fs__label">Category</label>
        <select class="select" id="edit-category">
          <option value="">— none —</option>
          <option value="bookstore">Bookstore</option>
          <option value="film_lab">Film Lab</option>
          <option value="coffee">Coffee</option>
          <option value="eat">Eat</option>
          <option value="drink">Drink</option>
          <option value="shop">Shop</option>
          <option value="see">See</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="save-fs__field">
        <label class="save-fs__label">Website</label>
        <input type="url" class="input" id="edit-website" placeholder="https://…">
      </div>
      <div class="save-fs__field">
        <label class="save-fs__label">Image URL</label>
        <input type="url" class="input" id="edit-image-url" placeholder="https://…">
      </div>
      <div class="save-fs__field">
        <label class="save-fs__label">Google Place ID</label>
        <input type="text" class="input" id="edit-google-place-id" placeholder="ChIJ…">
      </div>
    </div>
    <footer class="save-fs__foot">
      <button class="btn btn--danger btn--ghost" id="edit-delete">Delete</button>
      <button class="btn" id="edit-save">Save changes</button>
    </footer>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/nav.js"></script>
<script>
  if (!api.isSignedIn()) location.href = '/login.html?next=' + encodeURIComponent(location.pathname);

  let spots = [];
  let editingId = null;

  async function load() {
    const data = await api.get('/api/spots?curated=true&limit=500');
    spots = data.spots || [];
    render();
  }

  function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const cat = document.getElementById('category-filter').value;
    let filtered = spots.filter(s => {
      const matchQ = !q || (s.place_name||'').toLowerCase().includes(q) || (s.tip||'').toLowerCase().includes(q);
      const matchCat = !cat || s.curated_category === cat;
      return matchQ && matchCat;
    });

    const list = document.getElementById('spots-list');
    if (!filtered.length) { list.innerHTML = '<div class="list-empty">No curated spots found.</div>'; return; }

    list.innerHTML = filtered.map(s => `
      <div class="admin-table__row curated-row" data-id="${s.id}">
        <span class="col-name">
          <strong>${esc(s.place_name || '—')}</strong>
          ${s.tip ? `<br><small>${esc(s.tip)}</small>` : ''}
        </span>
        <span class="col-city">${esc(s.attached_cities?.[0]?.name || s.country || '—')}</span>
        <span class="col-cat">${s.curated_category ? `<span class="caption">${s.curated_category}</span>` : '—'}</span>
        <span class="col-img">${s.image_url ? '✓' : '—'}</span>
        <span class="admin-actions">
          <button onclick="openEdit(${s.id})">Edit</button>
        </span>
      </div>
    `).join('');
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function openEdit(id) {
    const s = spots.find(x => x.id === id);
    if (!s) return;
    editingId = id;
    document.getElementById('edit-title').textContent = s.place_name || 'Edit Spot';
    document.getElementById('edit-place-name').value = s.place_name || '';
    document.getElementById('edit-tip').value = s.tip || '';
    document.getElementById('edit-category').value = s.curated_category || '';
    document.getElementById('edit-website').value = s.website || '';
    document.getElementById('edit-image-url').value = s.image_url || '';
    document.getElementById('edit-google-place-id').value = s.google_place_id || '';
    const overlay = document.getElementById('edit-overlay');
    overlay.removeAttribute('hidden');
    overlay.classList.add('is-open');
  }

  function closeEdit() {
    const overlay = document.getElementById('edit-overlay');
    overlay.setAttribute('hidden', '');
    overlay.classList.remove('is-open');
    editingId = null;
  }

  document.getElementById('edit-close').addEventListener('click', closeEdit);

  document.getElementById('edit-save').addEventListener('click', async () => {
    if (!editingId) return;
    const body = {
      place_name:       document.getElementById('edit-place-name').value,
      tip:              document.getElementById('edit-tip').value,
      curated_category: document.getElementById('edit-category').value,
      website:          document.getElementById('edit-website').value,
      image_url:        document.getElementById('edit-image-url').value,
    };
    await api.patch(`/api/spots/${editingId}`, body);
    closeEdit();
    load();
  });

  document.getElementById('edit-delete').addEventListener('click', async () => {
    if (!editingId || !confirm('Delete this spot?')) return;
    await api.delete(`/api/spots/${editingId}`);
    closeEdit();
    load();
  });

  document.getElementById('search-input').addEventListener('input', render);
  document.getElementById('category-filter').addEventListener('change', render);

  load();
</script>
</body>
</html>
