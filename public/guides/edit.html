<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Editing guide — annex</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/spots.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/guides.css">
  <link rel="stylesheet" href="/css/uploader.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <a href="/guides/" class="logo">annex</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span id="hdr-time">—</span>
  </div>
</header>

<main class="page page-guide-edit">

  <header class="guide-edit__bar">
    <div class="guide-edit__crumb">
      <a href="/guides/">Guides</a> <span>/</span> <span id="crumb-title">Editing</span>
    </div>
    <div class="guide-edit__actions">
      <span class="guide-edit__saved" id="save-status"></span>
      <button class="btn btn--ghost" id="delete-btn" type="button">Delete</button>
      <button class="btn" id="publish-btn" type="button">Publish</button>
    </div>
  </header>

  <div class="builder">

    <!-- LEFT: the guide being assembled -->
    <section class="builder__guide">
      <input type="text" class="guide-title" id="guide-title" placeholder="Untitled guide" autocomplete="off">

      <div class="guide-head-row">
        <textarea class="guide-intro" id="guide-intro" placeholder="Optional intro — set the scene…" rows="2"></textarea>
        <div class="guide-cover" id="guide-cover">
          <input type="file" id="cover-input" accept="image/*" style="display:none">
          <button class="guide-cover__drop" id="cover-btn" type="button">
            <span class="guide-cover__plus">+</span>
            <span>Add a cover image</span>
          </button>
          <div class="guide-cover__filled" id="cover-filled" hidden>
            <img id="cover-img" alt="Cover">
            <button class="guide-cover__rm" id="cover-rm" type="button">Remove</button>
          </div>
        </div>
      </div>

      <div class="guide-settings">
        <div class="guide-settings__group">
          <span class="guide-settings__label">Anchor city</span>
          <select class="select select--small" id="guide-city">
            <option value="">Worldwide</option>
          </select>
        </div>
        <div class="guide-settings__group">
          <span class="guide-settings__label">Group</span>
          <div class="seg" id="seg-grouping">
            <button class="seg__btn is-active" data-val="list" type="button">Flat</button>
            <button class="seg__btn" data-val="category" type="button">By category</button>
          </div>
        </div>
        <div class="guide-settings__group">
          <span class="guide-settings__label">Order</span>
          <div class="seg" id="seg-sort">
            <button class="seg__btn is-active" data-val="manual" type="button">Manual</button>
            <button class="seg__btn" data-val="alpha" type="button">A–Z</button>
          </div>
        </div>
      </div>

      <div class="guide-spots" id="guide-spots">
        <div class="stream__empty">No spots yet — add from the right.</div>
      </div>
    </section>

    <!-- RIGHT: persistent spot picker -->
    <aside class="builder__picker">
      <div class="picker">
        <h3 class="picker__title">Add spots</h3>
        <div class="picker__filters">
          <input type="text" class="admin-search" id="picker-search" placeholder="Search all spots…" autocomplete="off">
          <select class="select select--small" id="picker-city">
            <option value="">All cities</option>
          </select>
          <select class="select select--small" id="picker-cat">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="picker__list" id="picker-list">
          <div class="stream__empty">Loading spots…</div>
        </div>
      </div>
    </aside>

  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/uploader.js"></script>
<script src="/js/guides-edit.js"></script>
</body>
</html>
