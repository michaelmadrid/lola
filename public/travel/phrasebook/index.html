<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Phrases — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/travel.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav">
    <a href="/" data-auth="in">Home</a>
    <a href="/travel/" data-auth="in">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/guides/" data-auth="in">Guides</a>
    <a href="/login.html" data-auth="out">Sign in</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/" data-auth="in">Home</a>
    <a href="/travel/" data-auth="in">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/guides/" data-auth="in">Guides</a>
    <a href="/admin/" data-auth="in">Admin</a>
    <a href="/settings.html" data-auth="in">Settings</a>
    <a href="/login.html" data-auth="out">Sign in</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<main class="page page-travel">

  <header class="travel-mast">
    <h1 class="travel-mast__title">Travel</h1>
    <nav class="travel-subnav">
      <a href="/travel/trips/"      class="travel-subnav__item">Trips</a>
      <a href="/travel/time/"       class="travel-subnav__item">Clocks</a>
      <a href="/travel/phrasebook/" class="travel-subnav__item is-active">Phrases</a>
      <a href="/travel/extras/"     class="travel-subnav__item">Extras</a>
    </nav>
  </header>

  <div class="pb-stickyrows">
    <div class="pb-row pb-row--lang" id="pb-langs"></div>
    <div class="pb-row pb-row--tier" id="pb-tiers"></div>
  </div>

  <div id="pb-content">
    <div class="pb-loading">Loading…</div>
  </div>

</main>

<footer class="foot">
  <div class="foot__bar">
    <div class="foot__left">
      <a class="ver" href="/idle/" title="snake">kit v0.5.1</a>
    </div>
    <div class="foot__right">
      <a href="/settings.html" data-auth="in">Settings</a>
      <a href="/admin/" data-auth="in">Admin</a>
      <a href="#" id="signout-link-foot" data-auth="in">Sign out</a>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script>
(async function () {
  const langsEl   = document.getElementById('pb-langs');
  const tiersEl   = document.getElementById('pb-tiers');
  const contentEl = document.getElementById('pb-content');

  let data = null;
  let activeLang = localStorage.getItem('kit.phrasebook.lang') || 'es';
  let activeTier = localStorage.getItem('kit.phrasebook.tier') || 'core';

  try {
    const res = await fetch('/travel/phrasebook.json');
    data = await res.json();
  } catch (err) {
    contentEl.innerHTML = '<div class="pb-loading">Could not load phrases.</div>';
    return;
  }

  // --- Build language filter ---
  data.languages.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'pb-chip' + (l.code === activeLang ? ' is-active' : '');
    btn.dataset.lang = l.code;
    btn.textContent = l.name;
    btn.addEventListener('click', () => {
      activeLang = l.code;
      localStorage.setItem('kit.phrasebook.lang', activeLang);
      langsEl.querySelectorAll('.pb-chip').forEach(b => b.classList.toggle('is-active', b.dataset.lang === activeLang));
      render();
    });
    langsEl.appendChild(btn);
  });

  // --- Build tier filter ---
  data.tiers.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'pb-chip' + (t.id === activeTier ? ' is-active' : '');
    btn.dataset.tier = t.id;
    btn.textContent = t.label;
    btn.addEventListener('click', () => {
      activeTier = t.id;
      localStorage.setItem('kit.phrasebook.tier', activeTier);
      tiersEl.querySelectorAll('.pb-chip').forEach(b => b.classList.toggle('is-active', b.dataset.tier === activeTier));
      render();
    });
    tiersEl.appendChild(btn);
  });

  function render() {
    const tier = data.tiers.find(t => t.id === activeTier) || data.tiers[0];
    if (!tier) { contentEl.innerHTML = ''; return; }

    let html = '';
    if (tier.subtitle) {
      html += '<p class="pb-tier-sub">' + escapeHtml(tier.subtitle) + '</p>';
    }
    html += '<div class="pb-list">';
    tier.phrases.forEach(p => {
      const tx = p[activeLang] || '—';
      html += '<div class="pb-row-phrase">';
      html += '<span class="pb-row-phrase__en">' + escapeHtml(p.en) + '</span>';
      html += '<span class="pb-row-phrase__tx">' + escapeHtml(tx) + '</span>';
      html += '</div>';
    });
    html += '</div>';
    contentEl.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  render();

  const signOutFoot = document.getElementById('signout-link-foot');
  if (signOutFoot) signOutFoot.addEventListener('click', (e) => { e.preventDefault(); api.signOut(); });
})();
</script>
</body>
</html>
