<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

 <!-- META PAGE -->
<title>POSTO</title>
<script>window.POSTO_PAGE = 'home';</script>


<script>document.write('<link rel="stylesheet" href="/css/shell.css?t=' + Date.now() + '">');</script>
<style>


  :root{
    /* --logo-color / --nav-bg / --nav-fg / --logo-pad-x/y now live in
       shell.css :root — shared by the .posto-mark partial on every page. */
    --bg:  #F8F8F8;
    --ink: #111;
    
    --sans: 'ABC Diatype', 'Helvetica Neue', Arial, sans-serif; /* real site loads ABC Diatype — this prototype falls back to system sans since the webfont isn't loaded here */
    
    --memory-bg: #151515; /* dark, not pure #000 */
    --memory-fg: #F8F8F8; /* same off-white as the rest of the site */
    
    --memory-size: 32px;
    --memory-size-mobile: 18px;
    
    ::selection {
        color:transparent;
        
    }
    
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    overscroll-behavior:none;
  }

  body{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }

  /* .posto-mark / .posto-subnav now live in shell.css — shared via
     the header partial (data-include="header" below). Nothing
     nav-related belongs in this file anymore. */

  /* ── Scroll-snap stage container ────────────────────────── */

  .stage-container{
    height:100vh;
    width:100vw;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
  }

  .stage{
    height:100vh;
    width:100vw;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    position:relative;
    overflow:hidden;
  }

  /* ── Stage 1 — horizontal drifting feed ─────────────────── */

  #stage-feed{
    background:var(--bg);
  }

  .feed-track{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:flex-start; /* was center — per-item vertical position now set inline by JS, see applyItemPlacement() */
    will-change:transform;
  }

  /* Height + top offset are set inline per-item by JS (applyItemPlacement) —
     both are viewport-relative percentages, same math the old single
     global --feed-item-h var used, just per-item now. */
  .feed-item{
    flex-shrink:0;
    margin-right:28px; /* keep in sync with CONFIG.itemGap in the script below */
    position:relative;
    overflow:hidden;
    background:#eee; /* shows while a real image is still loading */
  }

  .feed-item__img{
    height:100%;
    width:auto;
    display:block;
    object-fit:cover;
    pointer-events:none;
  }

  /* ── Board-source composition — a fixed-aspect frame containing
     freely-placed, possibly-overlapping items. The frame itself
     behaves exactly like a .feed-item as far as the drift engine
     is concerned (same track, same offset math); what's different
     is what's INSIDE it. ─────────────────────────────────────── */
  .board-frame{
    position:relative;
    flex-shrink:0;
    height:var(--board-frame-h, 72vh);
    aspect-ratio: var(--board-aspect, 16 / 9);
    /* No margin, no background — tiles butt seamlessly so the looped
       composition reads as one continuous field, and the page bg
       shows through wherever items don't cover. */
  }

  .board-frame__item{
    position:absolute;
    overflow:hidden;
    border-radius:2px;
    pointer-events:auto;
  }
  /* Linked items are clickable <a> elements */
  a.board-frame__item--linked{ cursor:pointer; }
  .board-frame__item img{
    width:100%;
    height:auto; /* natural aspect ratio — width_pct is the only authored dimension in the schema */
    display:block;
    pointer-events:none;
  }

  .board-frame__hover{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    transition:background 200ms ease;
    pointer-events:none;
  }
  .board-frame__item:hover .board-frame__hover{
    background:rgba(0,0,0,0.4);
  }
  .board-frame__label{
    /* --board-font controls the board stream's label type — set it in
       :root at the top of this file (or in shell.css) to restyle. */
    font-family:var(--board-font, "Helvetica Neue", Helvetica, Arial, sans-serif);
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#fff;
    opacity:0;
    transition:opacity 200ms ease;
  }
  .board-frame__item:hover .board-frame__label{ opacity:1; }

  /* ── Flat-plan mode ──────────────────────────────────────────
     Toggled by .is-flatplan on #stage-feed. Every image hides and
     its box becomes a white-fill / black-border schematic frame at
     the exact same size + position (so the composition, motion, and
     shapes are preserved) with a caption revealed. An "x-ray" of the
     board as its own printer's flat-plan. */
  .is-flatplan .board-frame__item{
    background:#fff;
    outline:1.5px solid #111;
    outline-offset:-1.5px;
  }
  .is-flatplan .board-frame__item img{ visibility:hidden; }
  .is-flatplan .board-frame__hover{ display:none; } /* no dim in schematic view */

  .board-frame__caption{
    position:absolute;
    inset:0;
    display:none; /* only shown in flat-plan */
    align-items:flex-start;
    padding:8px 9px;
    font-family:var(--board-font, "Helvetica Neue", Helvetica, Arial, sans-serif);
    font-size:11px;
    line-height:1.25;
    letter-spacing:0.01em;
    color:#111;
    pointer-events:none;
  }
  .is-flatplan .board-frame__caption{ display:flex; }

  /* ── TEMPORARY test toolbar (top-right) — two links to try the
     two views. Replace with real icon(s) once the behavior's settled. */
  /* ── View cycle glyph (bottom-right) ─────────────────────────
     One quiet mark that cycles Board → Flat-plan → Colophon →
     Board. The glyph shows the view you'll go to NEXT. Boards only. */
  .view-cycle{
    position:fixed;
    bottom:0; right:0;
    z-index:200;
    display:flex;
    align-items:center;
    padding:22px 24px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .view-cycle__glyph{
    font-size:15px;
    line-height:1;
    letter-spacing:0.05em;
  }

  /* ── Colophon ────────────────────────────────────────────────
     A small, tight, centered reading column — ABC Diatype, dense,
     no rules/labels/grid. Reads like someone wrote it, not like a
     generated form. Links flow inline in the text, underlined. */
  #board-colophon{
    position:fixed;
    inset:0;
    z-index:150;
    background:var(--bg);
    display:none;
    justify-content:center;
    align-items:flex-start;
    padding:12vh 24px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #board-colophon.is-open{ display:flex; }

  .colophon{
    width:80%;
    max-width:360px;
    margin:0 auto;
    font-family:"ABC Diatype", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size:15px;
    line-height:1.35;
    letter-spacing:-0.005em;
    color:#111;
    text-align:center;
  }

  /* Title + vibe: flowing intro paragraph, like a bio. */
  .colophon__intro{
    margin-bottom:1.4em;
    margin-top:100px;
  }
  .colophon__title{ font-weight:600; }
  .colophon__vibe{ font-weight:400; }

  /* Index: tight running lines, not a table. Each entry is just a
     line of text; the reference links inline where present. */
  .colophon__list{
    list-style:none;
    margin:0; padding:0;
  }
  .colophon__item{
    margin:0;
    padding:0;
    margin-bottom:6px;
  }
  .colophon__headline{ font-weight:500; }
  .colophon__ref a{
    color:#111;
    text-decoration:none;
    border-bottom:1px solid #111;
  }
  .colophon__ref a:hover{ opacity:0.55; }
  .feed-item__placeholder{
    height:100%;
    width:auto;
    aspect-ratio:var(--ar, 3 / 4);
    background:var(--swatch, #ddd);
    display:flex;
    align-items:flex-end;
    padding:14px;
  }
  .feed-item__num{
    font-size:11px;
    letter-spacing:0.06em;
    color:rgba(0,0,0,0.35);
  }

  /* Hover state — placeholder only, direction TBD.
     Currently: dim + centered label. */
  .feed-item__hover{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    transition:background 200ms ease;
  }
  .feed-item:hover .feed-item__hover{
    background:rgba(0,0,0,0.4);
  }
  .feed-item__label{
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#fff;
    opacity:0;
    transition:opacity 200ms ease;
  }
  .feed-item:hover .feed-item__label{ opacity:1; }

  /* ── Stage 2 — info (blank, slogan pinned bottom) ───────── */

  @media (max-width:720px){
    .slogan{ font-size:var(--memory-size-mobile); max-width:88vw; }
  }
  
  #stage-info{
    background:var(--memory-bg);
    height:300px;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;

    color:var(--stage-fg);
  }
  
  .slogan{

    max-width:80vw;
    text-align:center;
    font-weight:700;
    font-size:var(--memory-size);
    line-height:1.15;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    white-space:pre-line; /* respects intentional line breaks in the data */
    color:var(--memory-fg);
  }

  .info-slogan{
    display: none;
    font-family: var(--sans);
    padding-bottom:28px;
    font-size:12px;
    letter-spacing:0em;
    text-transform:uppercase;
    color:var(--memory-fg);
    text-align:center;
  }

</style>
</head>
<body>

  <!-- Fixed brand mark + subnav — markup + toggle script live in
       partials/header.html, shared with spot.html / spots.html /
       note.html. Edit labels/links there, not here. -->
  <div data-include="header"></div>

  <!-- View cycle — one glyph showing the NEXT view. Cycles
       Board → Flat-plan → Colophon → Board. Boards only. -->
  <button class="view-cycle" id="viewCycle" hidden aria-label="Change view">
    <span class="view-cycle__glyph" id="viewCycleGlyph">⋯</span>
  </button>

  <!-- Colophon — quiet printed index card, populated + toggled by JS -->
  <div id="board-colophon" aria-hidden="true"></div>

  <div class="stage-container" id="stageContainer">

    <!-- Stage 1: horizontal drifting feed -->
    <section class="stage" id="stage-feed">
      <div class="feed-track" id="feedTrack"></div>
    </section>

    <!-- Stage 2: info, blank except slogan pinned bottom -->
    <section class="stage" id="stage-info">
      
      <div class="slogan" id="slogan"></div>
      
      <p class="info-slogan">A record of attention</p>
    </section>

  </div>

<script>
  fetch('/js/includes.js?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text()).then(code => { (0, eval)(code); }).catch(() => {});
</script>


<script>
(function(){

  /* ============================================================
     CONFIG — every tunable knob lives here. Change a number,
     save, refresh. Nothing below this block needs touching for
     day-to-day tuning.
     ============================================================ */
  var CONFIG = {
    // Drift (auto-scroll) — driftSpeed is px-per-frame-at-60fps, but
    // motion is now TIME-BASED (see tick), so this speed is identical
    // on mobile and desktop regardless of actual frame rate.
    driftSpeed:       1.3,
    manualPauseMs:      900,  // how long drift pauses after you interrupt it

    // Feed item sizing
    itemHeightRatio:    0.7,  // fraction of window height, e.g. 0.7 = 70vh
    itemGap:              28, // px between items (also set in CSS .feed-item margin-right)

    // Interaction sensitivity
    wheelMultiplier:     1.1, // how far a horizontal wheel tick pans the feed

    // Touch swipe-throw (mobile)
    throwFriction:      0.94, // per-frame momentum decay after a fling (lower = stops sooner)
    throwMax:          6000,  // px/sec cap on a fling, so a wild flick isn't dizzying

    // Hover behavior
    pauseOnHover:        true, // stop the drift while hovering a card (not empty stage space)
    hoverResumeDelayMs:   200, // pause held for this long after the cursor leaves a card

    // Data source — resolves to either the raw feed or a published
    // board depending on what's set in the admin (home_config).
    // Backend confirmed deployed + migrated, safe to point here now.
    apiBase:       'https://studio.annex.site',
    notesEndpoint: '/api/boards/_home/public',

    // Board-source canvas — must match the aspect ratio used in
    // admin-boards.js's editor canvas, or a composition will look
    // different here than it did while being built. Height is
    // viewport-relative like everything else (self-scaling), width
    // follows from the aspect ratio.
    // Board-source canvas — aspect ratio is now stored PER BOARD and
    // read from the API response (data.aspect_w / aspect_h), so
    // changing the default for new boards never breaks existing ones.
    // Height/tiles stay global (they're just how much viewport the
    // frame fills + how many loop copies, not composition-affecting).
    canvasHeightRatio: 1.0,  // full viewport height — frame = whole screen top to bottom, matching the editor canvas. The editor's safe-zone guide marks comfortable top/bottom margins within this.
    canvasTileCount:   4
  };

  /* ============================================================
     Fallback feed data — used only if the live board_notes fetch
     below fails or returns nothing publishable with an image.
     Keeps the page from looking broken while content is thin.
     ============================================================ */
  var PLACEHOLDER_ITEMS = [
    { ar: '3 / 4',  swatch: '#e4e2dd', label: 'Bookstore — Paris'   },
    { ar: '4 / 3',  swatch: '#d8d4cb', label: 'Notebook — Lisbon'   },
    { ar: '1 / 1',  swatch: '#efece6', label: 'Shelf — Berlin'      },
    { ar: '3 / 4',  swatch: '#ddd9d0', label: 'Ephemera — Marseille'},
    { ar: '4 / 5',  swatch: '#e8e5df', label: 'Print run — Rome'    },
    { ar: '16 / 9', swatch: '#e0ddd6', label: 'Studio — Porto'      },
    { ar: '3 / 4',  swatch: '#e6e3dc', label: 'Bookstore — Umbria'  },
    { ar: '1 / 1',  swatch: '#dedad1', label: 'Object — Tuscany'    }
  ];

  var track = document.getElementById('feedTrack');
  var stageFeed = document.getElementById('stage-feed');

  /* Debounced remeasure — real <img> elements have no intrinsic
     width until they load, so the initial loopWidth measured
     right after render is a rough guess. Each image nudges a
     recount as it settles, batched so 8 near-simultaneous loads
     don't trigger 8 separate layout reads. */
  var remeasurePending = false;
  function onImageSettled(){
    if (remeasurePending) return;
    remeasurePending = true;
    requestAnimationFrame(function(){
      measureLoopWidth();
      remeasurePending = false;
    });
  }

  function imgSrc(url){
    if (!url) return '';
    return url.indexOf('http') === 0 ? url : CONFIG.apiBase + url;
  }

  // Postgres NUMERIC columns come back as strings over JSON — parse
  // to a real number, or null if absent/unparseable (feed source,
  // or a board item that predates these columns).
  function toPct(v){
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  // board_notes rows → feed items (feed source only — board source
  // is handled by boardItemsToCanvasItems below, an entirely
  // separate render path). Only rows with an image qualify; pinned
  // items sort first.
  function notesToFeedItems(notes){
    return notes
      .filter(function(n){ return !!n.image_url; })
      .sort(function(a, b){ return (b.pin ? 1 : 0) - (a.pin ? 1 : 0); })
      .map(function(n){
        return { image: imgSrc(n.image_url), label: n.headline || '' };
      });
  }

  // board_items rows (x_pct/y_pct/width_pct) → canvas placement data.
  function boardItemsToCanvasItems(items){
    return items
      .filter(function(n){ return !!n.image_url; })
      .map(function(n){
        return {
          image: imgSrc(n.image_url),
          label: n.headline || '',
          caption: n.reference_title || '', // shown in flat-plan mode
          url: n.reference_url || '',
          x: toPct(n.x_pct) || 0,
          y: toPct(n.y_pct) || 0,
          w: toPct(n.width_pct) || 20
        };
      });
  }

  function buildItem(data){
    var el = document.createElement('div');
    el.className = 'feed-item';

    if (data.image){
      var img = document.createElement('img');
      img.className = 'feed-item__img';
      img.src = data.image;
      img.alt = data.label || '';
      img.addEventListener('load', onImageSettled);
      img.addEventListener('error', onImageSettled); // don't leave loopWidth stale on a broken image
      el.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'feed-item__placeholder';
      ph.style.setProperty('--ar', data.ar);
      ph.style.setProperty('--swatch', data.swatch);

      var num = document.createElement('span');
      num.className = 'feed-item__num';
      num.textContent = data.label;
      ph.appendChild(num);

      el.appendChild(ph);
    }

    var hover = document.createElement('div');
    hover.className = 'feed-item__hover';
    var label = document.createElement('span');
    label.className = 'feed-item__label';
    label.textContent = data.label;
    hover.appendChild(label);

    el.appendChild(hover);

    if (CONFIG.pauseOnHover){
      // Touch fires pointerenter on tap with no matching pointerleave
      // (there's no "hover" to leave) — that was permanently freezing
      // the drift after the first tap on mobile. Mouse/pen only.
      el.addEventListener('pointerenter', function(e){
        if (e.pointerType === 'touch') return;
        isHovering = true;
      });
      el.addEventListener('pointerleave', function(e){
        if (e.pointerType === 'touch') return;
        isHovering = false;
        manualUntil = performance.now() + CONFIG.hoverResumeDelayMs;
      });
    }

    return el;
  }

  // Elements + their placement data, in render order (both copies of
  // the loop) — applyItemPlacement() walks this on every render and
  // every resize.
  var renderedItems = [];

  // Render a given item set twice back-to-back so the loop can
  // wrap seamlessly — once offset passes the width of one copy,
  // we subtract that width and keep drifting.
  function renderTrack(items){
    track.innerHTML = '';
    renderedItems = [];
    items.concat(items).forEach(function(data){
      var el = buildItem(data);
      track.appendChild(el);
      renderedItems.push({ el: el, data: data });
    });
    applyItemPlacement();
  }

  /* ── Feed-mode placement — global ratio, centered. Board mode
     uses applyBoardFrameSize() below instead; the two never mix
     since they're on entirely separate render paths. ──────────── */
  function applyItemPlacement(){
    var vh = window.innerHeight;
    var itemHeight = Math.round(vh * CONFIG.itemHeightRatio);
    renderedItems.forEach(function(entry){
      entry.el.style.height = itemHeight + 'px';
      entry.el.style.marginTop = Math.round((vh - itemHeight) / 2) + 'px';
    });
  }

  /* ============================================================
     Board mode — a fixed-aspect frame with freely-placed,
     possibly-overlapping items, tiled + drifted as one rigid
     composition ("moving the glass" over a fixed photograph —
     items never move relative to each other, only the whole
     assembly pans). Reuses the SAME drift engine as feed mode
     below; only what fills the track differs.
     ============================================================ */
  // boardAspect is set from the API response (the board's own stored
  // ratio) in loadFeed — NOT a global constant, so each board renders
  // at exactly the ratio it was composed against. Falls back to 32/9.
  var boardAspect = '32 / 9';

  function buildBoardFrame(items){
    var frame = document.createElement('div');
    frame.className = 'board-frame';
    frame.style.setProperty('--board-aspect', boardAspect);

    // API returns items front-first (position DESC) — reverse so
    // the DOM paints back-to-front (later-appended = on top).
    items.slice().reverse().forEach(function(item){
      // A linked item is an <a>, an unlinked one a plain <div> —
      // otherwise identical. Absolute (http/https) links open in a
      // new tab; relative links (internal) stay in the same tab.
      var hasLink = !!item.url;
      var el = document.createElement(hasLink ? 'a' : 'div');
      el.className = 'board-frame__item' + (hasLink ? ' board-frame__item--linked' : '');
      if (hasLink){
        el.href = item.url;
        if (/^https?:\/\//i.test(item.url)){
          el.target = '_blank';
          el.rel = 'noopener';
        }
      }
      el.style.left = item.x + '%';
      el.style.top = item.y + '%';
      el.style.width = item.w + '%';

      var img = document.createElement('img');
      img.src = item.image;
      img.alt = item.label || '';
      img.addEventListener('load', onImageSettled);
      img.addEventListener('error', onImageSettled);
      el.appendChild(img);

      // Hover dim + title only on linked items — an unlinked image
      // has nowhere to go, so no affordance.
      if (hasLink){
        var hover = document.createElement('div');
        hover.className = 'board-frame__hover';
        var label = document.createElement('span');
        label.className = 'board-frame__label';
        label.textContent = item.label || '';
        hover.appendChild(label);
        el.appendChild(hover);
      }

      // Flat-plan caption — present on EVERY item, hidden until the
      // board is toggled into flat-plan mode (.is-flatplan). Shows the
      // headline + reference title as the "image goes here" label.
      if (item.label || item.caption){
        var cap = document.createElement('div');
        cap.className = 'board-frame__caption';
        var capText = item.label || '';
        if (item.caption) capText += (capText ? ' — ' : '') + item.caption;
        cap.textContent = capText;
        el.appendChild(cap);
      }

      if (CONFIG.pauseOnHover){
        el.addEventListener('pointerenter', function(e){
          if (e.pointerType === 'touch') return;
          isHovering = true;
        });
        el.addEventListener('pointerleave', function(e){
          if (e.pointerType === 'touch') return;
          isHovering = false;
          manualUntil = performance.now() + CONFIG.hoverResumeDelayMs;
        });
      }

      frame.appendChild(el);
    });
    return frame;
  }

  function applyBoardFrameSize(){
    var vh = window.innerHeight;
    var h = Math.round(vh * CONFIG.canvasHeightRatio);
    var marginTop = Math.round((vh - h) / 2);
    document.querySelectorAll('.board-frame').forEach(function(frame){
      frame.style.height = h + 'px';
      frame.style.marginTop = marginTop + 'px';
    });
  }

  // Same composition tiled canvasTileCount×2 (still doubled for the
  // seamless wrap, same convention as feed mode) — every tile is
  // identical, so the loop reads as one continuous photograph.
  function renderBoardTrack(items){
    track.innerHTML = '';
    var totalTiles = CONFIG.canvasTileCount * 2;
    for (var i = 0; i < totalTiles; i++){
      track.appendChild(buildBoardFrame(items));
    }
    applyBoardFrameSize();
  }

  var currentMode = 'feed'; // 'feed' | 'board' — read by onResize below to pick the right recompute

  function loadFeed(){
    // ?preview=<id> — render a specific board on the real homepage
    // without touching home_config (the live board stays live for
    // everyone else). Used by the editor's "Preview on homepage"
    // button to test a draft in a real setting.
    var previewId = new URLSearchParams(location.search).get('preview');
    var url = previewId
      ? CONFIG.apiBase + '/api/boards/' + encodeURIComponent(previewId) + '/public'
      : CONFIG.apiBase + CONFIG.notesEndpoint;
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.source === 'board'){
          var canvasItems = boardItemsToCanvasItems(data.items || []);
          if (!canvasItems.length){
            console.warn('[POSTO] Board has no items with images — showing placeholders.');
            currentMode = 'feed';
            renderTrack(PLACEHOLDER_ITEMS);
            return;
          }
          // Use the board's OWN ratio from the response, so it renders
          // exactly as composed regardless of what the current default is.
          if (data.aspect_w && data.aspect_h){
            boardAspect = data.aspect_w + ' / ' + data.aspect_h;
          }
          currentMode = 'board';
          renderBoardTrack(canvasItems);
          // Stash board data for the colophon view.
          colophonData = {
            title: data.title || '',
            vibe: data.vibe || '',
            items: canvasItems
          };
          var cycleBtn = document.getElementById('viewCycle');
          if (cycleBtn) cycleBtn.hidden = false; // view cycle only exists for boards
          return;
        }

        currentMode = 'feed';
        var items = notesToFeedItems(data.notes || []);
        if (!items.length){
          console.warn('[POSTO] No published notes with images — showing placeholders.');
          renderTrack(PLACEHOLDER_ITEMS);
          return;
        }
        renderTrack(items);
      })
      .catch(function(err){
        console.warn('[POSTO] Could not load notes feed — showing placeholders.', err);
        currentMode = 'feed';
        renderTrack(PLACEHOLDER_ITEMS);
      });
  }
  loadFeed();

  /* ============================================================
     Horizontal drift — continuous, buttery (rAF + easing), with
     user horizontal scroll / drag able to interrupt it.
     Vertical wheel movement is left alone so it bubbles up to
     the scroll-snap container and moves to stage 2 normally.
     ============================================================ */

  var offset = 0;            // current horizontal offset (px)
  var userOffset = 0;         // pending offset from drag/wheel
  var isHovering = false;
  var resumeTimer = null;
  var manualUntil = 0;        // timestamp until which auto-drift pauses
  var loopWidth = 0;

  function measureLoopWidth(){
    // half of scrollWidth == width of one full (non-duplicated) set
    loopWidth = track.scrollWidth / 2;
  }
  measureLoopWidth();

  /* Single rAF-batched resize pass: recompute placement, THEN
     read scrollWidth on the next frame (after layout has settled)
     rather than back-to-back — avoids forced-synchronous-layout
     thrashing while the window is actively being dragged. */
  var resizePending = false;
  function onResize(){
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(function(){
      if (currentMode === 'board') applyBoardFrameSize();
      else applyItemPlacement();
      requestAnimationFrame(function(){
        measureLoopWidth();
        resizePending = false;
      });
    });
  }
  window.addEventListener('resize', onResize);

  function applyTransform(){
    if (loopWidth > 0){
      // wrap seamlessly
      if (offset >= loopWidth) offset -= loopWidth;
      if (offset < 0) offset += loopWidth;
    }
    track.style.transform = 'translateX(' + (-offset) + 'px)';
  }

  var lastFrameTime = 0;
  var throwVelocity = 0; // px/sec of residual momentum from a swipe throw

  function tick(now){
    // Time-based motion — distance depends on ELAPSED TIME, not frame
    // count. A fixed per-frame increment ran slower on mobile (lower/
    // variable frame rate = fewer increments per second). dt fixes it
    // so drift speed is identical on every device.
    if (!lastFrameTime) lastFrameTime = now;
    var dt = Math.min((now - lastFrameTime) / 1000, 0.05); // seconds, capped so a stutter can't jump huge
    lastFrameTime = now;

    if (!isHovering && now > manualUntil){
      // driftSpeed stays authored in px/frame-at-60fps for familiarity;
      // ×60 → px/sec, ×dt → this frame's step.
      offset += CONFIG.driftSpeed * 60 * dt;
    }

    // Throw momentum from a swipe — decays exponentially to zero.
    if (Math.abs(throwVelocity) > 1){
      offset -= throwVelocity * dt;
      throwVelocity *= Math.pow(CONFIG.throwFriction, dt * 60);
    } else {
      throwVelocity = 0;
    }

    applyTransform();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* Horizontal wheel / trackpad swipe interrupts + pans directly.
     Vertical wheel intent (deltaY dominant) is NOT captured here,
     so it falls through to the scroll-snap container as normal.

     Listener is PASSIVE — overflow-x is already hidden on this
     stage, so there's nothing native to preventDefault(), and a
     passive listener lets the browser start its scroll-snap
     physics immediately instead of waiting on this handler every
     tick. A non-passive listener here was the main cause of
     scroll-snap feeling sluggish. */
  stageFeed.addEventListener('wheel', function(e){
    var horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (!horizontal) return; // let vertical scroll-snap handle it
    offset += e.deltaX * CONFIG.wheelMultiplier;
    manualUntil = performance.now() + CONFIG.manualPauseMs;
  }, { passive:true });

  /* ── Touch: swipe to pan, release to "throw" ─────────────────
     Mobile has no wheel, so a horizontal swipe pans the drift
     directly and, on release, flings it with momentum proportional
     to flick speed. Vertical swipes are left alone so the page's
     scroll-snap (down to stage 2) still works. */
  var touchStartX = 0, touchStartY = 0;
  var touchLastX = 0, touchLastT = 0;
  var touchIsHorizontal = null;
  var touchActive = false;

  stageFeed.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    touchStartX = touchLastX = t.clientX;
    touchStartY = t.clientY;
    touchLastT = performance.now();
    touchIsHorizontal = null;
    touchActive = true;
    throwVelocity = 0; // grabbing kills any existing throw
  }, { passive:true });

  stageFeed.addEventListener('touchmove', function(e){
    if (!touchActive) return;
    var t = e.touches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;

    if (touchIsHorizontal === null){
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return; // wait for clear intent
      touchIsHorizontal = Math.abs(dx) > Math.abs(dy);
    }
    if (!touchIsHorizontal) return; // vertical → let the page scroll-snap

    var now = performance.now();
    var moveX = t.clientX - touchLastX;
    offset -= moveX;
    var dtms = now - touchLastT;
    if (dtms > 0) throwVelocity = (moveX / dtms) * 1000; // px/sec, for the throw
    touchLastX = t.clientX;
    touchLastT = now;
    manualUntil = now + CONFIG.manualPauseMs;
  }, { passive:true });

  stageFeed.addEventListener('touchend', function(){
    touchActive = false;
    // Cap the fling so a wild flick isn't dizzying; tick() applies + decays it.
    throwVelocity = Math.max(-CONFIG.throwMax, Math.min(CONFIG.throwMax, throwVelocity));
    manualUntil = performance.now() + CONFIG.manualPauseMs;
  }, { passive:true });

  /* Rollover pause is wired per-item inside buildItem() below —
     hovering a card stops the drift; hovering empty stage space
     does not. Toggle off entirely via CONFIG.pauseOnHover. */

  // Colophon — quiet printed index card. Built from colophonData
  // (captured at board load) and toggled over the drifting feed.
  var colophonData = null;

  function escHtml(s){
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function refLinkHtml(item){
    var text = item.caption || item.url || '';
    if (!text) return '';
    if (!item.url) return '<span class="colophon__ref">' + escHtml(text) + '</span>';
    var abs = /^https?:\/\//i.test(item.url);
    var attrs = abs ? ' target="_blank" rel="noopener"' : '';
    return '<span class="colophon__ref"><a href="' + escHtml(item.url) + '"' + attrs + '>' +
           escHtml(text) + '</a></span>';
  }

  function buildColophon(){
    if (!colophonData) return '';
    var html = '<div class="colophon">';

    // Intro: title + vibe as one flowing block.
    if (colophonData.title || colophonData.vibe){
      html += '<div class="colophon__intro">';
      if (colophonData.title) html += '<span class="colophon__title">' + escHtml(colophonData.title) + '</span>';
      if (colophonData.vibe)  html += (colophonData.title ? ' ' : '') + '<br><span class="colophon__vibe">' + escHtml(colophonData.vibe) + '</span>';
      html += '</div>';
    }

    // Index: tight running lines. Headline, then reference inline.
    html += '<ul class="colophon__list">';
    colophonData.items.forEach(function(item){
      var ref = refLinkHtml(item);
      html += '<li class="colophon__item">' +
                '<span class="colophon__headline">' + escHtml(item.label || 'Untitled') + '</span><br>' +
                (ref ? ' ' + ref : '') +
              '</li>';
    });
    html += '</ul>';

    html += '</div>';
    return html;
  }

  /* ── View cycle: Board → Flat-plan → Colophon → Board ────────
     One glyph. It shows the view you'll go to NEXT (like a play
     button advertises the action, not the current state). Tapping
     applies that view and advances the glyph to the following one. */
  // The glyph shows what tapping does NEXT. From the board, ⋯ = "there's
  // more here" (invites the info views). Once in an info view, the glyph
  // advances to the next one, and the last one returns you to the board.
  var VIEWS = [
    { key:'board',    glyph:'⋯' }, // board showing → ⋯ "more"
    { key:'colophon', glyph:'⋯' }, // colophon showing → still more to see
    { key:'flatplan', glyph:'×' }  // flat-plan showing → × back to the board
  ];
  var viewIndex = 0; // currently showing the board (VIEWS[0])

  var cycleBtn   = document.getElementById('viewCycle');
  var cycleGlyph = document.getElementById('viewCycleGlyph');
  var colophonEl = document.getElementById('board-colophon');

  function applyView(){
    var view = VIEWS[viewIndex].key;
    stageFeed.classList.toggle('is-flatplan', view === 'flatplan');

    if (colophonEl){
      if (view === 'colophon'){
        colophonEl.innerHTML = buildColophon();
        colophonEl.classList.add('is-open');
        colophonEl.setAttribute('aria-hidden', 'false');
      } else {
        colophonEl.classList.remove('is-open');
        colophonEl.setAttribute('aria-hidden', 'true');
      }
    }

    // Glyph reflects the CURRENT view: ⋯ while there's more to peel
    // back, × on the last info view to return to the board.
    if (cycleGlyph) cycleGlyph.textContent = VIEWS[viewIndex].glyph;
  }

  function cycle(){
    viewIndex = (viewIndex + 1) % VIEWS.length;
    applyView();
  }

  if (cycleBtn){
    // Set the initial glyph to the board (current) view.
    applyView();
    cycleBtn.addEventListener('click', cycle);
    document.addEventListener('keydown', function(e){
      if (e.code === 'Space' && !cycleBtn.hidden && document.activeElement === document.body){
        e.preventDefault();
        cycle();
      }
    });
  }

})();
</script>

<script>
(function(){

  /* ============================================================
     Content — preserves your intentional line breaks as-is
     ============================================================ */
  var SLOGANS = [
    "MOOD FOLLOWS ACTION",
    "SHIT OR GET OFF THE POT",
    "CHANCE FAVORS THE PREPARED MIND",
    "THE SECRET TO GETTING AHEAD\nIS GETTING STARTED",
    "IT'S OK TO EXIST BEYOND THE BORDERS\nOF WHO YOU THINK YOU ARE",
    "WHO ARE YOU BECOMING?",
    "MAKE IT ANYWAY",
    "THE MOST PERSONAL IS THE MOST CREATIVE"
  ];

  var stageInfo = document.getElementById('stage-info');
  var slogan = document.getElementById('slogan');


  // Random starting point, then walks in order (wrapping) from there —
  // so the sequence itself stays intact, only the entry point varies.
  var sIndex = Math.floor(Math.random() * SLOGANS.length);

  function render(){
    slogan.textContent = SLOGANS[sIndex];
  }

  function next(){
    sIndex = (sIndex + 1) % SLOGANS.length;
    render();
  }

  stageInfo.addEventListener('click', function(){
    
    next();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === ' '){
    
      next();
    }
  });

  render();

})();
</script>
