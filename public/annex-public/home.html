<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSTO</title>
<script>window.POSTO_PAGE = 'home';</script>
<script>document.write('<link rel="stylesheet" href="/css/shell.css?t=' + Date.now() + '">');</script>
<style>


  :root{
    /* --logo-color / --nav-bg / --nav-fg / --logo-pad-x/y now live in
       shell.css :root — shared by the .posto-mark partial on every page. */
    --bg:  #F8F8F8;
    --ink: #111;
    
    --sans: 'ABC Diatype', 'Helvetica Neue', Arial, sans-serif; /* real site loads ABC Diatype — this prototype falls back to system sans since the webfont isn't loaded here */
    
    --memory-bg: #151515; /* dark, not pure #000 */
    --memory-fg: #F8F8F8; /* same off-white as the rest of the site */
    
    --memory-size: 44px;
    --memory-size-mobile: 32px;
    
    ::selection {
        color:red;
        
    }
    
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    overscroll-behavior:none;
  }

  body{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }

  /* .posto-mark / .posto-subnav now live in shell.css — shared via
     the header partial (data-include="header" below). Nothing
     nav-related belongs in this file anymore. */

  /* ── Scroll-snap stage container ────────────────────────── */

  .stage-container{
    height:100vh;
    width:100vw;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
  }

  .stage{
    height:100vh;
    width:100vw;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    position:relative;
    overflow:hidden;
  }

  /* ── Stage 1 — horizontal drifting feed ─────────────────── */

  #stage-feed{
    background:var(--bg);
  }

  .feed-track{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:flex-start; /* was center — per-item vertical position now set inline by JS, see applyItemPlacement() */
    will-change:transform;
  }

  /* Height + top offset are set inline per-item by JS (applyItemPlacement) —
     both are viewport-relative percentages, same math the old single
     global --feed-item-h var used, just per-item now. */
  .feed-item{
    flex-shrink:0;
    margin-right:28px; /* keep in sync with CONFIG.itemGap in the script below */
    position:relative;
    overflow:hidden;
    background:#eee; /* shows while a real image is still loading */
  }

  .feed-item__img{
    height:100%;
    width:auto;
    display:block;
    object-fit:cover;
    pointer-events:none;
  }

  /* ── Board-source composition — a fixed-aspect frame containing
     freely-placed, possibly-overlapping items. The frame itself
     behaves exactly like a .feed-item as far as the drift engine
     is concerned (same track, same offset math); what's different
     is what's INSIDE it. ─────────────────────────────────────── */
  .board-frame{
    position:relative;
    flex-shrink:0;
    height:var(--board-frame-h, 72vh);
    aspect-ratio: var(--board-aspect, 16 / 9);
    /* No margin, no background — tiles butt seamlessly so the looped
       composition reads as one continuous field, and the page bg
       shows through wherever items don't cover. */
  }

  .board-frame__item{
    position:absolute;
    overflow:hidden;
    border-radius:2px;
    pointer-events:auto;
  }
  .board-frame__item img{
    width:100%;
    height:auto; /* natural aspect ratio — width_pct is the only authored dimension in the schema */
    display:block;
    pointer-events:none;
  }

  .board-frame__hover{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    transition:background 200ms ease;
    pointer-events:none;
  }
  .board-frame__item:hover .board-frame__hover{
    background:rgba(0,0,0,0.4);
  }
  .board-frame__label{
    font-family: "ABC Diatype";
    font-weight: 500;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#fff;
    opacity:0;
    transition:opacity 200ms ease;
  }
  .board-frame__item:hover .board-frame__label{ opacity:1; }
  .feed-item__placeholder{
    height:100%;
    width:auto;
    aspect-ratio:var(--ar, 3 / 4);
    background:var(--swatch, #ddd);
    display:flex;
    align-items:flex-end;
    padding:14px;
  }
  .feed-item__num{
    font-size:11px;
    letter-spacing:0.06em;
    color:rgba(0,0,0,0.35);
  }

  /* Hover state — placeholder only, direction TBD.
     Currently: dim + centered label. */
  .feed-item__hover{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    transition:background 200ms ease;
  }
  .feed-item:hover .feed-item__hover{
    background:rgba(0,0,0,0.4);
  }
  .feed-item__label{
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#fff;
    opacity:0;
    transition:opacity 200ms ease;
  }
  .feed-item:hover .feed-item__label{ opacity:1; }

  /* ── Stage 2 — info (blank, slogan pinned bottom) ───────── */

  @media (max-width:720px){
    .slogan{ font-size:var(--memory-size-mobile); max-width:88vw; }
  }
  
  #stage-info{
    background:var(--memory-bg);
    height:300px;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;

    color:var(--stage-fg);
  }
  
  .slogan{

    max-width:80vw;
    text-align:center;
    font-weight:700;
    font-size:var(--memory-size);
    line-height:1.15;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    white-space:pre-line; /* respects intentional line breaks in the data */
    color:var(--memory-fg);
  }

  .info-slogan{
    display: none;
    font-family: var(--sans);
    padding-bottom:28px;
    font-size:12px;
    letter-spacing:0em;
    text-transform:uppercase;
    color:var(--memory-fg);
    text-align:center;
  }

</style>
</head>
<body>

  <!-- Fixed brand mark + subnav — markup + toggle script live in
       partials/header.html, shared with spot.html / spots.html /
       note.html. Edit labels/links there, not here. -->
  <div data-include="header"></div>

  <div class="stage-container" id="stageContainer">

    <!-- Stage 1: horizontal drifting feed -->
    <section class="stage" id="stage-feed">
      <div class="feed-track" id="feedTrack"></div>
    </section>

    <!-- Stage 2: info, blank except slogan pinned bottom -->
    <section class="stage" id="stage-info">
      
      <div class="slogan" id="slogan"></div>
      
      <p class="info-slogan">A record of attention</p>
    </section>

  </div>

<script>
  fetch('/js/includes.js?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text()).then(code => { (0, eval)(code); }).catch(() => {});
</script>


<script>
(function(){

  /* ============================================================
     CONFIG — every tunable knob lives here. Change a number,
     save, refresh. Nothing below this block needs touching for
     day-to-day tuning.
     ============================================================ */
  var CONFIG = {
    // Drift (auto-scroll)
    driftSpeed:       1.3,   // px per frame — was 0.35, feeling was 2x too slow
    manualPauseMs:      900,  // how long drift pauses after you interrupt it

    // Feed item sizing
    itemHeightRatio:    0.7,  // fraction of window height, e.g. 0.7 = 70vh
    itemGap:              28, // px between items (also set in CSS .feed-item margin-right)

    // Interaction sensitivity
    wheelMultiplier:     1.1, // how far a horizontal wheel tick pans the feed

    // Hover behavior
    pauseOnHover:        true, // stop the drift while hovering a card (not empty stage space)
    hoverResumeDelayMs:   200, // pause held for this long after the cursor leaves a card

    // Data source — resolves to either the raw feed or a published
    // board depending on what's set in the admin (home_config).
    // Backend confirmed deployed + migrated, safe to point here now.
    apiBase:       'https://studio.annex.site',
    notesEndpoint: '/api/boards/_home/public',

    // Board-source canvas — must match the aspect ratio used in
    // admin-boards.js's editor canvas, or a composition will look
    // different here than it did while being built. Height is
    // viewport-relative like everything else (self-scaling), width
    // follows from the aspect ratio.
    // canvasAspectRatio MUST match the editor's canvas aspect ratio
    // (boards-editor.css .boards-canvas-frame) or compositions will
    // render differently here than they were designed. Both are 32/9
    // — a wide panorama, so one tile is wider than the viewport and
    // the loop seam stays off-screen.
    canvasAspectRatio: 32 / 9,
    canvasHeightRatio: 0.88,
    canvasTileCount:   4        // fewer needed now each tile is ~3× viewport width
  };

  /* ============================================================
     Fallback feed data — used only if the live board_notes fetch
     below fails or returns nothing publishable with an image.
     Keeps the page from looking broken while content is thin.
     ============================================================ */
  var PLACEHOLDER_ITEMS = [
    { ar: '3 / 4',  swatch: '#e4e2dd', label: 'Bookstore — Paris'   },
    { ar: '4 / 3',  swatch: '#d8d4cb', label: 'Notebook — Lisbon'   },
    { ar: '1 / 1',  swatch: '#efece6', label: 'Shelf — Berlin'      },
    { ar: '3 / 4',  swatch: '#ddd9d0', label: 'Ephemera — Marseille'},
    { ar: '4 / 5',  swatch: '#e8e5df', label: 'Print run — Rome'    },
    { ar: '16 / 9', swatch: '#e0ddd6', label: 'Studio — Porto'      },
    { ar: '3 / 4',  swatch: '#e6e3dc', label: 'Bookstore — Umbria'  },
    { ar: '1 / 1',  swatch: '#dedad1', label: 'Object — Tuscany'    }
  ];

  var track = document.getElementById('feedTrack');
  var stageFeed = document.getElementById('stage-feed');

  /* Debounced remeasure — real <img> elements have no intrinsic
     width until they load, so the initial loopWidth measured
     right after render is a rough guess. Each image nudges a
     recount as it settles, batched so 8 near-simultaneous loads
     don't trigger 8 separate layout reads. */
  var remeasurePending = false;
  function onImageSettled(){
    if (remeasurePending) return;
    remeasurePending = true;
    requestAnimationFrame(function(){
      measureLoopWidth();
      remeasurePending = false;
    });
  }

  function imgSrc(url){
    if (!url) return '';
    return url.indexOf('http') === 0 ? url : CONFIG.apiBase + url;
  }

  // Postgres NUMERIC columns come back as strings over JSON — parse
  // to a real number, or null if absent/unparseable (feed source,
  // or a board item that predates these columns).
  function toPct(v){
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  // board_notes rows → feed items (feed source only — board source
  // is handled by boardItemsToCanvasItems below, an entirely
  // separate render path). Only rows with an image qualify; pinned
  // items sort first.
  function notesToFeedItems(notes){
    return notes
      .filter(function(n){ return !!n.image_url; })
      .sort(function(a, b){ return (b.pin ? 1 : 0) - (a.pin ? 1 : 0); })
      .map(function(n){
        return { image: imgSrc(n.image_url), label: n.headline || '' };
      });
  }

  // board_items rows (x_pct/y_pct/width_pct) → canvas placement data.
  function boardItemsToCanvasItems(items){
    return items
      .filter(function(n){ return !!n.image_url; })
      .map(function(n){
        return {
          image: imgSrc(n.image_url),
          label: n.headline || '',
          x: toPct(n.x_pct) || 0,
          y: toPct(n.y_pct) || 0,
          w: toPct(n.width_pct) || 20
        };
      });
  }

  function buildItem(data){
    var el = document.createElement('div');
    el.className = 'feed-item';

    if (data.image){
      var img = document.createElement('img');
      img.className = 'feed-item__img';
      img.src = data.image;
      img.alt = data.label || '';
      img.addEventListener('load', onImageSettled);
      img.addEventListener('error', onImageSettled); // don't leave loopWidth stale on a broken image
      el.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'feed-item__placeholder';
      ph.style.setProperty('--ar', data.ar);
      ph.style.setProperty('--swatch', data.swatch);

      var num = document.createElement('span');
      num.className = 'feed-item__num';
      num.textContent = data.label;
      ph.appendChild(num);

      el.appendChild(ph);
    }

    var hover = document.createElement('div');
    hover.className = 'feed-item__hover';
    var label = document.createElement('span');
    label.className = 'feed-item__label';
    label.textContent = data.label;
    hover.appendChild(label);

    el.appendChild(hover);

    if (CONFIG.pauseOnHover){
      // Touch fires pointerenter on tap with no matching pointerleave
      // (there's no "hover" to leave) — that was permanently freezing
      // the drift after the first tap on mobile. Mouse/pen only.
      el.addEventListener('pointerenter', function(e){
        if (e.pointerType === 'touch') return;
        isHovering = true;
      });
      el.addEventListener('pointerleave', function(e){
        if (e.pointerType === 'touch') return;
        isHovering = false;
        manualUntil = performance.now() + CONFIG.hoverResumeDelayMs;
      });
    }

    return el;
  }

  // Elements + their placement data, in render order (both copies of
  // the loop) — applyItemPlacement() walks this on every render and
  // every resize.
  var renderedItems = [];

  // Render a given item set twice back-to-back so the loop can
  // wrap seamlessly — once offset passes the width of one copy,
  // we subtract that width and keep drifting.
  function renderTrack(items){
    track.innerHTML = '';
    renderedItems = [];
    items.concat(items).forEach(function(data){
      var el = buildItem(data);
      track.appendChild(el);
      renderedItems.push({ el: el, data: data });
    });
    applyItemPlacement();
  }

  /* ── Feed-mode placement — global ratio, centered. Board mode
     uses applyBoardFrameSize() below instead; the two never mix
     since they're on entirely separate render paths. ──────────── */
  function applyItemPlacement(){
    var vh = window.innerHeight;
    var itemHeight = Math.round(vh * CONFIG.itemHeightRatio);
    renderedItems.forEach(function(entry){
      entry.el.style.height = itemHeight + 'px';
      entry.el.style.marginTop = Math.round((vh - itemHeight) / 2) + 'px';
    });
  }

  /* ============================================================
     Board mode — a fixed-aspect frame with freely-placed,
     possibly-overlapping items, tiled + drifted as one rigid
     composition ("moving the glass" over a fixed photograph —
     items never move relative to each other, only the whole
     assembly pans). Reuses the SAME drift engine as feed mode
     below; only what fills the track differs.
     ============================================================ */
  function buildBoardFrame(items){
    var frame = document.createElement('div');
    frame.className = 'board-frame';
    frame.style.setProperty('--board-aspect', CONFIG.canvasAspectRatio);

    // API returns items front-first (position DESC) — reverse so
    // the DOM paints back-to-front (later-appended = on top).
    items.slice().reverse().forEach(function(item){
      var el = document.createElement('div');
      el.className = 'board-frame__item';
      el.style.left = item.x + '%';
      el.style.top = item.y + '%';
      el.style.width = item.w + '%';

      var img = document.createElement('img');
      img.src = item.image;
      img.alt = item.label || '';
      img.addEventListener('load', onImageSettled);
      img.addEventListener('error', onImageSettled);
      el.appendChild(img);

      var hover = document.createElement('div');
      hover.className = 'board-frame__hover';
      var label = document.createElement('span');
      label.className = 'board-frame__label';
      label.textContent = item.label || '';
      hover.appendChild(label);
      el.appendChild(hover);

      if (CONFIG.pauseOnHover){
        el.addEventListener('pointerenter', function(e){
          if (e.pointerType === 'touch') return;
          isHovering = true;
        });
        el.addEventListener('pointerleave', function(e){
          if (e.pointerType === 'touch') return;
          isHovering = false;
          manualUntil = performance.now() + CONFIG.hoverResumeDelayMs;
        });
      }

      frame.appendChild(el);
    });
    return frame;
  }

  function applyBoardFrameSize(){
    var vh = window.innerHeight;
    var h = Math.round(vh * CONFIG.canvasHeightRatio);
    var marginTop = Math.round((vh - h) / 2);
    document.querySelectorAll('.board-frame').forEach(function(frame){
      frame.style.height = h + 'px';
      frame.style.marginTop = marginTop + 'px';
    });
  }

  // Same composition tiled canvasTileCount×2 (still doubled for the
  // seamless wrap, same convention as feed mode) — every tile is
  // identical, so the loop reads as one continuous photograph.
  function renderBoardTrack(items){
    track.innerHTML = '';
    var totalTiles = CONFIG.canvasTileCount * 2;
    for (var i = 0; i < totalTiles; i++){
      track.appendChild(buildBoardFrame(items));
    }
    applyBoardFrameSize();
  }

  var currentMode = 'feed'; // 'feed' | 'board' — read by onResize below to pick the right recompute

  function loadFeed(){
    var url = CONFIG.apiBase + CONFIG.notesEndpoint;
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.source === 'board'){
          var canvasItems = boardItemsToCanvasItems(data.items || []);
          if (!canvasItems.length){
            console.warn('[POSTO] Board has no items with images — showing placeholders.');
            currentMode = 'feed';
            renderTrack(PLACEHOLDER_ITEMS);
            return;
          }
          currentMode = 'board';
          renderBoardTrack(canvasItems);
          return;
        }

        currentMode = 'feed';
        var items = notesToFeedItems(data.notes || []);
        if (!items.length){
          console.warn('[POSTO] No published notes with images — showing placeholders.');
          renderTrack(PLACEHOLDER_ITEMS);
          return;
        }
        renderTrack(items);
      })
      .catch(function(err){
        console.warn('[POSTO] Could not load notes feed — showing placeholders.', err);
        currentMode = 'feed';
        renderTrack(PLACEHOLDER_ITEMS);
      });
  }
  loadFeed();

  /* ============================================================
     Horizontal drift — continuous, buttery (rAF + easing), with
     user horizontal scroll / drag able to interrupt it.
     Vertical wheel movement is left alone so it bubbles up to
     the scroll-snap container and moves to stage 2 normally.
     ============================================================ */

  var offset = 0;            // current horizontal offset (px)
  var userOffset = 0;         // pending offset from drag/wheel
  var isHovering = false;
  var resumeTimer = null;
  var manualUntil = 0;        // timestamp until which auto-drift pauses
  var loopWidth = 0;

  function measureLoopWidth(){
    // half of scrollWidth == width of one full (non-duplicated) set
    loopWidth = track.scrollWidth / 2;
  }
  measureLoopWidth();

  /* Single rAF-batched resize pass: recompute placement, THEN
     read scrollWidth on the next frame (after layout has settled)
     rather than back-to-back — avoids forced-synchronous-layout
     thrashing while the window is actively being dragged. */
  var resizePending = false;
  function onResize(){
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(function(){
      if (currentMode === 'board') applyBoardFrameSize();
      else applyItemPlacement();
      requestAnimationFrame(function(){
        measureLoopWidth();
        resizePending = false;
      });
    });
  }
  window.addEventListener('resize', onResize);

  function applyTransform(){
    if (loopWidth > 0){
      // wrap seamlessly
      if (offset >= loopWidth) offset -= loopWidth;
      if (offset < 0) offset += loopWidth;
    }
    track.style.transform = 'translateX(' + (-offset) + 'px)';
  }

  function tick(){
    var now = performance.now();
    if (!isHovering && now > manualUntil){
      offset += CONFIG.driftSpeed;
    }
    applyTransform();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* Horizontal wheel / trackpad swipe interrupts + pans directly.
     Vertical wheel intent (deltaY dominant) is NOT captured here,
     so it falls through to the scroll-snap container as normal.

     Listener is PASSIVE — overflow-x is already hidden on this
     stage, so there's nothing native to preventDefault(), and a
     passive listener lets the browser start its scroll-snap
     physics immediately instead of waiting on this handler every
     tick. A non-passive listener here was the main cause of
     scroll-snap feeling sluggish. */
  stageFeed.addEventListener('wheel', function(e){
    var horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (!horizontal) return; // let vertical scroll-snap handle it
    offset += e.deltaX * CONFIG.wheelMultiplier;
    manualUntil = performance.now() + CONFIG.manualPauseMs;
  }, { passive:true });

  /* Rollover pause is wired per-item inside buildItem() below —
     hovering a card stops the drift; hovering empty stage space
     does not. Toggle off entirely via CONFIG.pauseOnHover. */

})();
</script>

<script>
(function(){

  /* ============================================================
     Content — preserves your intentional line breaks as-is
     ============================================================ */
  var SLOGANS = [
    "MOOD FOLLOWS ACTION",
    "SHIT OR GET OFF THE POT",
    "CHANCE FAVORS THE PREPARED MIND",
    "THE SECRET TO GETTING AHEAD\nIS GETTING STARTED",
    "IT'S OK TO EXIST BEYOND THE BORDERS\nOF WHO YOU THINK YOU ARE",
    "WHO ARE YOU BECOMING?",
    "MAKE IT ANYWAY",
    "THE MOST PERSONAL IS THE MOST CREATIVE"
  ];

  var stageInfo = document.getElementById('stage-info');
  var slogan = document.getElementById('slogan');


  // Random starting point, then walks in order (wrapping) from there —
  // so the sequence itself stays intact, only the entry point varies.
  var sIndex = Math.floor(Math.random() * SLOGANS.length);

  function render(){
    slogan.textContent = SLOGANS[sIndex];
  }

  function next(){
    sIndex = (sIndex + 1) % SLOGANS.length;
    render();
  }

  stageInfo.addEventListener('click', function(){
    
    next();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === ' '){
    
      next();
    }
  });

  render();

})();
</script>
</body>
</html>
