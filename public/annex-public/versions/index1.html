<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index — Summer Holiday</title>
  <style>
    @font-face {
      font-family: "ABC Diatype";
      src: url("https://kit.summer-holiday.com/fonts/ABCDiatypeTrial-Regular.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "ABC Diatype";
      src: url("https://kit.summer-holiday.com/fonts/ABCDiatypeTrial-Medium.woff2") format("woff2");
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "ABC Diatype Mono";
      src: url("https://kit.summer-holiday.com/fonts/ABCDiatypeMonoTrial-Regular.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sans: "ABC Diatype", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --mono: "ABC Diatype Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --ink: #111;
      --ink-2: #555;
      --ink-3: #999;
      --rule: #e0e0e0;
      --accent: #2a4ed4;
      --gutter: 40px;
    }

    html { background: #fff; color: var(--ink); font-family: var(--sans); }
    body { min-height: 100vh; }

    /* ===== Hero ===== */
    .hero {
      padding: 60px var(--gutter) 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hero__title {
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .hero__brand {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding-top: 8px;
    }

    /* ===== Controls bar ===== */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px var(--gutter);
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      flex-wrap: wrap;
      background: #fff;
      z-index: 50;
    }
    .controls.is-stuck {
      position: sticky;
      top: 0;
    }
    .controls__search {
      font-family: var(--sans);
      font-size: 14px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 7px 16px;
      outline: none;
      width: 180px;
      background: transparent;
      color: var(--ink);
    }
    .controls__search:focus { border-color: var(--ink); }
    .controls__search::placeholder { color: var(--ink-3); }

    .pill-select {
      position: relative;
      display: inline-block;
    }
    .pill-btn {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
      transition: all 140ms ease;
      white-space: nowrap;
    }
    .pill-btn:hover { border-color: var(--ink); color: var(--ink); }
    .pill-btn.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .pill-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 8px 0;
      min-width: 220px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .pill-dropdown.is-open { display: block; }
    .pill-dropdown__search {
      font-family: var(--sans);
      font-size: 14px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      padding: 8px 16px;
      width: 100%;
      outline: none;
      background: transparent;
    }
    .pill-dropdown__item {
      display: block;
      width: 100%;
      text-align: left;
      font-family: var(--sans);
      font-size: 15px;
      padding: 10px 16px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: var(--ink);
    }
    .pill-dropdown__item:hover { background: #f5f5f5; }
    .pill-dropdown__item .country {
      font-size: 13px;
      color: var(--ink-3);
      margin-left: 8px;
    }
    .pill-dropdown__item.is-active { color: var(--accent); font-weight: 500; }

    .sort-btn {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 7px 8px;
    }
    .sort-btn:hover { color: var(--ink); }

    .controls__count {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-left: auto;
    }

    /* ===== Table ===== */
    .index-table {
      width: 100%;
    }
    .index-row {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 3fr) minmax(0, 2fr);
      border-bottom: 1px solid var(--rule);
      padding: 0 var(--gutter);
    }
    .index-row--head {
      border-bottom: 1px solid var(--rule);
      background: #fff;
    }
    .index-row--head span {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 10px 0;
    }
    .index-cell {
      padding: 16px 0;
      padding-right: 24px;
      font-size: 16px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .index-cell__name {
      font-weight: 500;
      color: var(--ink);
    }
    .index-cell__name a {
      color: inherit;
      text-decoration: none;
    }
    .index-cell__name a:hover { color: var(--accent); }
    .index-cell__tip {
      font-size: 15px;
      color: var(--ink-2);
    }
    .index-cell__city {
      font-size: 15px;
      color: var(--ink);
    }
    .index-cell__country {
      font-size: 13px;
      color: var(--ink-3);
    }
    .index-cell__links {
      display: flex;
      gap: 12px;
      margin-top: 2px;
    }
    .index-cell__link {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      text-decoration: none;
    }
    .index-cell__link:hover { color: var(--accent); }

    .empty {
      padding: 80px var(--gutter);
      text-align: center;
      font-size: 15px;
      color: var(--ink-3);
    }

    /* ===== Mobile ===== */
    @media (max-width: 720px) {
      :root { --gutter: 20px; }
      .hero { padding: 40px var(--gutter) 24px; }
      .hero__title { font-size: 48px; }
      .controls { gap: 8px; padding: 10px var(--gutter); }
      .controls__search { width: 100%; order: -1; }
      .index-row { grid-template-columns: 1fr; gap: 2px; padding: 12px var(--gutter); }
      .index-row--head { display: none; }
      .index-cell { padding: 0; padding-right: 0; }
      .index-cell__country { display: inline; }
      .index-cell__city { display: inline; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1 class="hero__title">Index</h1>
    <span class="hero__brand">Summer Holiday</span>
  </header>

  <div class="controls" id="controls">
    <input type="text" class="controls__search" id="search" placeholder="Search…">

    <div class="pill-select" id="city-select">
      <button class="pill-btn" id="city-btn">City</button>
      <div class="pill-dropdown" id="city-dropdown">
        <input type="text" class="pill-dropdown__search" id="city-search" placeholder="Type a city…">
        <div id="city-list"></div>
      </div>
    </div>

    <div class="pill-select" id="cat-select">
      <button class="pill-btn" id="cat-btn">Category</button>
      <div class="pill-dropdown" id="cat-dropdown">
        <div id="cat-list"></div>
      </div>
    </div>

    <button class="sort-btn" id="sort-btn" title="Sort">A–Z</button>

    <span class="controls__count" id="count"></span>
  </div>

  <div class="index-table" id="table">
    <div class="index-row index-row--head">
      <span>Place</span>
      <span>Info</span>
      <span>Location</span>
    </div>
    <div id="rows"><div class="empty">Loading…</div></div>
  </div>

<script>
  const API = 'https://kit.summer-holiday.com/api/spots/index';
  let allSpots = [];
  let categories = [];
  let activeCity = null;
  let activeCat = null;
  let sortMode = 'az';

  async function load() {
    const res = await fetch(API);
    const data = await res.json();
    allSpots = data.spots || [];
    categories = data.categories || [];
    buildCityList();
    buildCatList();
    render();
    initSticky();
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // City dropdown
  function buildCityList() {
    const cities = [...new Map(
      allSpots.filter(s => s.city).map(s => [s.city, { name: s.city, country: s.country }])
    ).values()].sort((a,b) => a.name.localeCompare(b.name));

    renderCityItems(cities);

    document.getElementById('city-search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      renderCityItems(q ? cities.filter(c => c.name.toLowerCase().includes(q)) : cities);
    });
  }

  function renderCityItems(cities) {
    const el = document.getElementById('city-list');
    el.innerHTML = '<button class="pill-dropdown__item' + (!activeCity ? ' is-active' : '') + '" data-val="">All cities</button>' +
      cities.map(c =>
        '<button class="pill-dropdown__item' + (activeCity === c.name ? ' is-active' : '') + '" data-val="' + esc(c.name) + '">' +
        esc(c.name) + '<span class="country">' + esc(c.country) + '</span></button>'
      ).join('');
    el.querySelectorAll('.pill-dropdown__item').forEach(b => {
      b.addEventListener('click', () => {
        activeCity = b.dataset.val || null;
        document.getElementById('city-btn').textContent = activeCity || 'City';
        document.getElementById('city-btn').classList.toggle('is-active', !!activeCity);
        document.getElementById('city-dropdown').classList.remove('is-open');
        render();
      });
    });
  }

  // Category dropdown
  function buildCatList() {
    const el = document.getElementById('cat-list');
    el.innerHTML = '<button class="pill-dropdown__item is-active" data-val="">All</button>' +
      categories.map(c =>
        '<button class="pill-dropdown__item" data-val="' + c.value + '">' + c.label + '</button>'
      ).join('');
    el.querySelectorAll('.pill-dropdown__item').forEach(b => {
      b.addEventListener('click', () => {
        activeCat = b.dataset.val || null;
        document.getElementById('cat-btn').textContent = activeCat ? categories.find(c=>c.value===activeCat).label : 'Category';
        document.getElementById('cat-btn').classList.toggle('is-active', !!activeCat);
        document.getElementById('cat-dropdown').classList.remove('is-open');
        render();
      });
    });
  }

  // Pill toggle
  document.getElementById('city-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('cat-dropdown').classList.remove('is-open');
    document.getElementById('city-dropdown').classList.toggle('is-open');
    if (document.getElementById('city-dropdown').classList.contains('is-open')) {
      document.getElementById('city-search').focus();
    }
  });
  document.getElementById('cat-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('city-dropdown').classList.remove('is-open');
    document.getElementById('cat-dropdown').classList.toggle('is-open');
  });
  document.addEventListener('click', () => {
    document.getElementById('city-dropdown').classList.remove('is-open');
    document.getElementById('cat-dropdown').classList.remove('is-open');
  });
  document.querySelectorAll('.pill-dropdown').forEach(d => d.addEventListener('click', e => e.stopPropagation()));

  // Sort
  const sortModes = ['az', 'za', 'newest', 'oldest'];
  const sortLabels = { az: 'A–Z', za: 'Z–A', newest: 'Newest', oldest: 'Oldest' };
  document.getElementById('sort-btn').addEventListener('click', () => {
    const i = (sortModes.indexOf(sortMode) + 1) % sortModes.length;
    sortMode = sortModes[i];
    document.getElementById('sort-btn').textContent = sortLabels[sortMode];
    render();
  });

  // Search
  document.getElementById('search').addEventListener('input', render);

  // Render
  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    let spots = allSpots.filter(s => {
      if (q && !(s.place_name||'').toLowerCase().includes(q) && !(s.tip||'').toLowerCase().includes(q) && !(s.city||'').toLowerCase().includes(q)) return false;
      if (activeCity && s.city !== activeCity) return false;
      if (activeCat && s.category !== activeCat) return false;
      return true;
    });

    if (sortMode === 'az') spots.sort((a,b) => (a.place_name||'').localeCompare(b.place_name||''));
    else if (sortMode === 'za') spots.sort((a,b) => (b.place_name||'').localeCompare(a.place_name||''));
    else if (sortMode === 'newest') spots.sort((a,b) => b.id - a.id);
    else if (sortMode === 'oldest') spots.sort((a,b) => a.id - b.id);

    document.getElementById('count').textContent = spots.length + ' place' + (spots.length !== 1 ? 's' : '');

    const el = document.getElementById('rows');
    if (!spots.length) { el.innerHTML = '<div class="empty">Nothing here.</div>'; return; }

    el.innerHTML = spots.map(s => {
      const mapsUrl = s.google_place_id
        ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.place_name) + '&query_place_id=' + s.google_place_id
        : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((s.place_name||'') + ' ' + (s.city||''));

      const links = [];
      if (s.website) links.push('<a class="index-cell__link" href="' + esc(s.website) + '" target="_blank" rel="noopener">Web</a>');
      if (s.place_name) links.push('<a class="index-cell__link" href="' + mapsUrl + '" target="_blank" rel="noopener">Map</a>');

      return '<div class="index-row">' +
        '<div class="index-cell"><span class="index-cell__name">' + esc(s.place_name) + '</span>' +
          (links.length ? '<div class="index-cell__links">' + links.join('') + '</div>' : '') +
        '</div>' +
        '<div class="index-cell"><span class="index-cell__tip">' + esc(s.tip || '') + '</span></div>' +
        '<div class="index-cell"><span class="index-cell__city">' + esc(s.city || '') + '</span>' +
          (s.country ? ' <span class="index-cell__country">' + esc(s.country) + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Sticky controls
  function initSticky() {
    const controls = document.getElementById('controls');
    const hero = document.querySelector('.hero');
    const observer = new IntersectionObserver(([e]) => {
      controls.classList.toggle('is-stuck', !e.isIntersecting);
    }, { threshold: 0 });
    observer.observe(hero);
  }

  load();
</script>
</body>
</html>
