<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ── SEO / social ─────────────────────────────────────
       DEFAULT/fallback tags. This page is client-rendered, so social
       scrapers (iMessage, Twitter, etc.) see only these, not the note's
       real content. To add rich per-note previews later: have the studio
       backend serve this file and replace the OG_META marker below with
       the note's real og:title / og:description / og:image. The visible
       content JS stays exactly as-is. -->
  <title>Annex</title>
  <meta name="description" content="A note from Annex.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Annex">
  <meta property="og:title" content="Annex">
  <meta property="og:description" content="A note from Annex.">
  <meta property="og:image" content="https://annex.site/og-default.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!-- OG_META -->

  <script>document.write('<link rel="stylesheet" href="/css/shell.css?t=' + Date.now() + '">');</script>
</head>
<body>

<div class="page">

  <!-- ── Header (edit in /partials/header.html) ───────── -->
  <div data-include="header"></div>

  <main class="note-permalink" id="note-permalink">
    <!-- filled by note.js -->
  </main>

  <!-- ── Footer (edit in /partials/footer.html) ───────── -->
  <div data-include="footer"></div>

</div><!-- /page -->

<script>
  fetch('/js/includes.js?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text()).then(code => { (0, eval)(code); }).catch(() => {});
</script>
<script>
  fetch('/js/note.js?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text()).then(code => { (0, eval)(code); }).catch(() => {});
</script>

  plausible.init()
</script>

</body>
</html>
