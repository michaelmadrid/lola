<!-- Fixed brand mark + subnav — styling lives in css/shell.css
     (.posto-mark / .posto-subnav). Edit labels/links here; every
     page that includes this partial picks up changes on refresh. -->
<div class="posto-mark" tabindex="0">
  <a href="/"><span class="posto-mark__word">POSTO</span></a>
  <nav class="posto-subnav">
    <a class="posto-subnav__item" href="/spots?layout=gazette&cat=bookstore">Bookstores</a>
    <a class="posto-subnav__item" href="/notes/?layout=shelf" >Outpost</a>
    <a class="posto-subnav__item" href="/spots?layout=wall">Wall</a>
    <a class="posto-subnav__item" href="#">Info</a>
  </nav>
</div>

<script>
  (function () {


    var NAV_MODE = {
      // static pages, matched via window.POSTO_PAGE
      home:  { open: true,  horz: false },
      spot:  { open: false, horz: false },
      note:  { open: false, horz: false },

      // spots.html layout variants, matched via ?layout=
      'layout:wall':      { open: true,  horz: true  },
      'layout:gazette':   { open: true,  horz: true },
      'layout:shelf':     { open: false, horz: false },
      'layout:catalogue': { open: false, horz: false }
    };
    var DEFAULT_MODE = { open: false, horz: false };

    var layout = new URLSearchParams(location.search).get('layout');
    var key = layout ? ('layout:' + layout) : (window.POSTO_PAGE || null);
    var mode = (key && NAV_MODE[key]) || DEFAULT_MODE;

    document.body.classList.toggle('nav-open', mode.open);
    document.body.classList.toggle('nav-horz', mode.horz);
  })();
</script>

<script>
  /* Click/tap toggle — works identically on desktop and mobile.
     Hover (CSS only, in shell.css) still works as a bonus on
     desktop, but this is the reliable path everywhere. Runs once
     per page since includes.js recreates this <script> fresh
     after injecting the partial — see js/includes.js. */
  (function () {
    var mark = document.querySelector('.posto-mark');
    var word = document.querySelector('.posto-mark__word');
    if (!mark || !word) return;

    word.addEventListener('click', function (e) {
      e.stopPropagation();
      mark.classList.toggle('is-open');
    });

    document.addEventListener('click', function (e) {
      if (!mark.contains(e.target)) mark.classList.remove('is-open');
    });

  })();
</script>
