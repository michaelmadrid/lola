<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");}}catch(e){}</script>
  <title>Board editor — annex</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/spots.css">
  <link rel="stylesheet" href="/css/boards-editor.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">annex</a>
  </div>
  <nav class="nav" data-nav="primary"></nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay" data-nav="drawer">
  <div class="menu-overlay__inner"></div>
</div>

<main class="page page-boards-editor">

  <header class="mast">
    <div class="mast__head">
      <div>
        <p class="mast__crumb"><a href="/boards/">Boards</a> /</p>
        <h1 class="mast__title" id="boardTitle">Loading…</h1>
      </div>
      <div class="mast__head-right boards-editor__topbar">
        <select class="select select--small" id="statusSelect">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="archived">Archived</option>
        </select>
        <button class="btn btn--secondary btn--small" id="previewBtn" type="button">Preview ↗</button>
        <button class="btn btn--secondary btn--small" id="setHomeBtn" type="button">Set as Home</button>
      </div>
    </div>
  </header>

  <div class="boards-editor" id="boardsEditor">

    <!-- Drawer toggle — slides the left panel in/out so the canvas
         can be seen full-width. Glyph flips with state. -->
    <button class="boards-drawer-toggle" id="drawerToggle" type="button" aria-label="Toggle panel">‹</button>

    <div class="boards-editor__left">
      <div class="boards-editor__left-head">
        <input type="text" class="input input--small" id="titleInput" placeholder="Edition title">
        <textarea class="textarea" id="vibeInput" placeholder="Vibe / curatorial note…" rows="2"></textarea>
      </div>

      <div class="item-list" id="itemList">
        <div class="stream__empty">Loading…</div>
      </div>

      <div class="boards-editor__left-foot">
        <button class="btn" id="addNotesBtn" type="button">+ Add notes from library</button>
      </div>
    </div>

    <div class="boards-editor__right">
      <div class="boards-editor__right-head">
        <div>
          <span class="caption">Live placement</span>
          <div class="boards-editor__hint" id="modeHint">Drag anywhere to move · drag the accent dot to resize · list order (left) is front-to-back stacking</div>
        </div>
        <div class="boards-editor__controls">
          <label class="boards-editor__grid-toggle"><input type="checkbox" id="gridToggle" checked> Grid</label>
          <button class="btn btn--secondary btn--small" id="modeToggle" type="button">Preview drift ▶</button>
        </div>
      </div>
      <div class="boards-canvas-wrap" id="canvasWrap">
        <div class="boards-canvas-drift-track" id="driftTrack"></div>
      </div>
    </div>

  </div>

  <!-- Add-notes picker -->
  <div class="modal boards-note-picker" id="notePicker">
    <div class="modal__head">
      <button class="btn-close-circle" id="notePickerClose" aria-label="Close" type="button">×</button>
      <h3>Add notes</h3>
    </div>
    <div class="modal__body">
      <div class="boards-note-picker__filters">
        <input type="text" class="input" id="notePickerSearch" placeholder="Search notes…" autocomplete="off">
        <select class="select" id="notePickerCat">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="boards-note-picker__grid" id="notePickerGrid"></div>
    </div>
  </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/boards-editor.js"></script>
</body>
</html>
