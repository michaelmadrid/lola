<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{if(localStorage.getItem("lola.theme")==="dark"){document.documentElement.classList.add("dark");document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("dark");});}}catch(e){}</script>
  <title>Clocks — kit</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/travel.css">
</head>
<body>

<header class="head">
  <div class="head__left">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <span class="menu-btn__icon" aria-hidden="true">
        <span class="menu-btn__bar menu-btn__bar--top"></span>
        <span class="menu-btn__bar menu-btn__bar--bottom"></span>
      </span>
    </button>
    <a href="/" class="logo">kit</a>
  </div>
  <nav class="nav">
    <a href="/" data-auth="in">Home</a>
    <a href="/travel/" data-auth="in">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/guides/" data-auth="in">Guides</a>
    <a href="/login.html" data-auth="out">Sign in</a>
  </nav>
  <div class="head__right">
    <span class="where">Bali</span>
    <span id="hdr-time">—</span>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-overlay__inner">
    <a href="/" data-auth="in">Home</a>
    <a href="/travel/" data-auth="in">Travel</a>
    <a href="/spots/" data-auth="in">Spots</a>
    <a href="/guides/" data-auth="in">Guides</a>
    <a href="/admin/" data-auth="in">Admin</a>
    <a href="/settings.html" data-auth="in">Settings</a>
    <a href="/login.html" data-auth="out">Sign in</a>
    <a href="#" id="signout-link" class="menu-overlay__signout" data-auth="in">Sign out</a>
  </div>
</div>

<main class="page page-clocks">

  <header class="mast">
    <div class="mast__head">
      <div>
        <h1 class="mast__title">Clocks</h1>
        <p class="mast__intro">Track time across the cities you care about</p>
      </div>
      <button class="btn" id="time-add-btn-top" type="button">+ Add city</button>
    </div>
  </header>

  <section class="time-section">
    <div class="time-cities" id="time-cities">
      <div class="time-cities__empty">Loading…</div>
    </div>
  </section>

  <section class="time-section">
    <h2 class="time-section__label">24-hour overlap</h2>
    <p class="time-section__hint">Bars are awake hours.</p>
    <div class="time-timeline" id="time-timeline"></div>
  </section>

  <section class="time-section">
    <h2 class="time-section__label">Best call windows</h2>
    <p class="time-section__hint">Shown in your local time. Hours when the other side is awake.</p>
    <div class="time-windows" id="time-windows"></div>
  </section>

</main>

<div class="time-add-popover" id="time-add-popover">
  <input type="text" class="time-add-search" id="time-add-search" placeholder="Type a city…" autocomplete="off">
  <div class="time-add-list" id="time-add-list"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/util.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/time.js"></script>
</body>
</html>
